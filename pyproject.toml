[build-system]
# Keep this parseable by Homebrew Python 3.10's setuptools (often 68.x
# and used in-process when pip skips build isolation). SPDX
# license = "Apache-2.0" is setuptools 77+ / PEP 639 only.
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plaibook"
version = "0.1.26"
description = "Ansible-native AI code-review pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{ name = "Adam Knochowski", email = "aknochow@redhat.com" }]
keywords = ["ansible", "code-review", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # 2.18/2.19 need 3.11. ansible-lint 26 forbids 2.17.*, so 3.10 stays
    # on 2.16.19 (last 2.16 that satisfies that lint constraint).
    "ansible-core>=2.16.19,<2.17.0; python_version < '3.11'",
    "ansible-core>=2.16.0,<2.20.0; python_version >= '3.11'",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    "cursor-sdk>=1.0.31,<2.0.0",
]

[project.scripts]
plaibook = "plaibook.cli:main"
plai = "plaibook.cli:main"

[project.urls]
Homepage = "https://github.com/aknochow/ansible-plaibook"
Issues = "https://github.com/aknochow/ansible-plaibook/issues"
Source = "https://github.com/aknochow/ansible-plaibook"
Documentation = "https://github.com/aknochow/ansible-plaibook/blob/main/docs/getting-started.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=4.0.0,<8.0.0",
    "ruff>=0.9.0",
    "ansible-lint>=24.0.0",
]
# Cursor is the default first-run provider; keep the extra so
# `pip install plaibook[cursor]` / `uv sync --extra cursor` still work.
cursor = [
    "cursor-sdk>=1.0.31,<2.0.0",
]

[tool.setuptools.packages.find]
include = ["plaibook*"]

[tool.setuptools.package-data]
plaibook = ["share/**/*", "hashed/**/*"]

[tool.setuptools.cmdclass]
build_py = "plaibook._setup_share.build_py"

[tool.pytest.ini_options]
testpaths = ["plaibook", "action_plugins", "library", "roles/review/files/pr_review", "scripts"]
python_files = ["test_*.py"]
addopts = "-v"
# uv sync / uv build materializes plaibook/share/. Skip it so pytest does
# not collect the vendored copies of action_plugins/test_*.py (import-file mismatch).
norecursedirs = [".*", "build", "dist", "node_modules", ".venv", "venv", "*.egg", "share"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"action_plugins/*" = ["E402", "E501"]
"filter_plugins/*" = ["E402", "E501"]
"library/*" = ["E402", "E501"]
"tests/library/*" = ["E402", "E501"]
"roles/*" = ["E402", "E501"]
