---
# A clone retries a network failure and fails at once on anything else. Uses the
# same pattern and until expression as the clone tasks in clone_target_pr.yml
# (git commands) and resolve_target_branch.yml (the git module).
- name: Clone retry
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../roles/review/defaults/main.yml
  tasks:
    - name: Make a clone directory
      ansible.builtin.tempfile:
        state: directory
      register: _dir

    - name: Run the clones and remove the directory
      block:
        - name: Clone a host that does not resolve
          ansible.builtin.git:
            repo: https://clone-retry-test.invalid/org/repo.git
            dest: "{{ _dir.path }}/transient"
            version: HEAD
          register: _transient
          async: 30
          poll: 1
          until: >-
            _transient is succeeded or
            (((_transient.msg | default('')) ~ ' ' ~ (_transient.stderr | default(''))) is not search(review_clone_transient_pattern))
          retries: 2
          delay: 0
          ignore_errors: true

        - name: Clone a local path that does not exist
          ansible.builtin.git:
            repo: "{{ _dir.path }}/missing"
            dest: "{{ _dir.path }}/permanent"
            version: HEAD
          register: _permanent
          async: 30
          poll: 1
          until: >-
            _permanent is succeeded or
            (((_permanent.msg | default('')) ~ ' ' ~ (_permanent.stderr | default(''))) is not search(review_clone_transient_pattern))
          retries: 2
          delay: 0
          ignore_errors: true

        - name: Partial-clone a host that does not resolve
          ansible.builtin.command:
            argv:
              - git
              - clone
              - --filter=blob:none
              - --no-checkout
              - --
              - https://clone-retry-test.invalid/org/repo.git
              - "{{ _dir.path }}/transient-command"
          environment:
            GIT_TERMINAL_PROMPT: "0"
          register: _transient_command
          async: 30
          poll: 1
          until: >-
            _transient_command is succeeded or
            (((_transient_command.msg | default('')) ~ ' ' ~ (_transient_command.stderr | default(''))) is not search(review_clone_transient_pattern))
          retries: 2
          delay: 0
          ignore_errors: true

        - name: Partial-clone a local path that does not exist
          ansible.builtin.command:
            argv:
              - git
              - clone
              - --filter=blob:none
              - --no-checkout
              - --
              - "{{ _dir.path }}/missing"
              - "{{ _dir.path }}/permanent-command"
          environment:
            GIT_TERMINAL_PROMPT: "0"
          register: _permanent_command
          async: 30
          poll: 1
          until: >-
            _permanent_command is succeeded or
            (((_permanent_command.msg | default('')) ~ ' ' ~ (_permanent_command.stderr | default(''))) is not search(review_clone_transient_pattern))
          retries: 2
          delay: 0
          ignore_errors: true

        - name: Check the attempts
          ansible.builtin.assert:
            that:
              - _transient is failed
              - _transient.attempts | int > 1
              - _permanent is failed
              - _permanent.attempts | int == 1
              - _transient_command is failed
              # git empties the clone directory when a clone fails, so the
              # last retry still fails on the network, not on "destination
              # path already exists".
              - _transient_command.attempts | int == 2
              - _transient_command.stderr is search('Could not resolve host')
              - _permanent_command is failed
              - _permanent_command.attempts | int == 1
      always:
        - name: Remove the clone directory
          ansible.builtin.file:
            path: "{{ _dir.path }}"
            state: absent
