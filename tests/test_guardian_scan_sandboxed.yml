# The guardian scan stays on the controller even when a review is sandboxed.
# This used to install ai-guardian over SSH into the guest. That path paid
# for unreachable sandbox connections and still skipped the scan.
#
# Usage:
#   ansible-playbook tests/test_guardian_scan_sandboxed.yml

- name: Guardian scan ignores review_delegate_host
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    review_delegate_host: sandbox-must-not-be-contacted
    review_guardian_binary: ai-guardian-missing-for-test
    review_guardian_scan_enabled: true
    review_full_diff: "diff --git a/a b/a\n"
    review_context: ""

  tasks:
    - name: Run the scan with a delegate host that must not be contacted
      ansible.builtin.include_role:
        name: review
        tasks_from: guardian_scan.yml

    - name: Assert the scan stayed on the controller and did not install a fake binary
      ansible.builtin.assert:
        that:
          - _guardian_scan_host == inventory_hostname
          - not (guardian_scan_available | bool)
          - guardian_scan_skip_reason == "ai-guardian not installed"
          - guardian_findings == []
        fail_msg: >-
          Expected a controller scan that reports the missing test binary.
          host={{ _guardian_scan_host | default('undefined') }}
          available={{ guardian_scan_available | default('undefined') }}
          skip_reason={{ guardian_scan_skip_reason | default('undefined') }}
        success_msg: "Guardian scan stayed on the controller."
