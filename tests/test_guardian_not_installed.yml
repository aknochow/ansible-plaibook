---
# Inverse of tests/test_guardian_scan.yml: that file end_play's when
# ai-guardian is missing. This file is the missing-binary path — it
# runs in environments where the scan is silently lost today
# (unsandboxed, use_sandbox=false, no self-install).
#
# Always runs: review_guardian_binary is set to a name that is never
# installed, so a host with a real ai-guardian on PATH still exercises
# this skip_reason. Do not end_play when the real binary is present.
#
# Usage:
#   ansible-playbook tests/test_guardian_not_installed.yml

- name: "Test guardian_scan.yml reports ai-guardian not installed"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    review_delegate_host: sandbox-must-not-be-contacted
    review_guardian_binary: ai-guardian-missing-for-test
    review_full_diff: |
      diff --git a/app.py b/app.py
      index abc123..def456 100644
      --- a/app.py
      +++ b/app.py
      @@ -1,2 +1,3 @@
       def add(a, b):
      +    return a + b
    review_context: ""
    review_guardian_scan_enabled: true

  tasks:
    - name: Run guardian_scan.yml with the scan binary absent (unsandboxed)
      ansible.builtin.include_role:
        name: review
        tasks_from: guardian_scan.yml

    - name: Assert the skip reason names the missing install, not a scan error
      ansible.builtin.assert:
        that:
          - not (guardian_scan_available | bool)
          - guardian_scan_skip_reason == "ai-guardian not installed"
          - guardian_findings == []
          - "'exited 2' not in guardian_scan_skip_reason"
          - _guardian_scan_host == inventory_hostname
        fail_msg: >-
          Expected skip_reason 'ai-guardian not installed' when the
          binary is missing on an unsandboxed host. Got available=
          {{ guardian_scan_available | default('undefined') }},
          skip_reason={{ guardian_scan_skip_reason | default('undefined') }}
        success_msg: "Missing ai-guardian is reported as not installed, not as scan exited 2."

- name: "Test guardian_scan.yml does not interpolate the binary name into sh -c"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    review_delegate_host: sandbox-must-not-be-contacted
    review_full_diff: |
      diff --git a/app.py b/app.py
      index abc123..def456 100644
      --- a/app.py
      +++ b/app.py
      @@ -1,2 +1,3 @@
       def add(a, b):
      +    return a + b
    review_context: ""
    review_guardian_scan_enabled: true

  tasks:
    - name: Create a unique marker path
      ansible.builtin.tempfile:
        state: file
        suffix: "-guardian-inject-marker"
      register: _inject_marker

    - name: Remove the empty marker so only a shell injection can recreate it
      ansible.builtin.file:
        path: "{{ _inject_marker.path }}"
        state: absent

    - name: Run guardian_scan.yml with a binary name that is extra shell if interpolated
      vars:
        review_guardian_binary: "missing-bin; touch {{ _inject_marker.path }}"
      ansible.builtin.include_role:
        name: review
        tasks_from: guardian_scan.yml

    - name: Stat the marker
      ansible.builtin.stat:
        path: "{{ _inject_marker.path }}"
      register: _inject_stat

    - name: Assert the binary name stayed an argv, not shell source
      ansible.builtin.assert:
        that:
          - not (_inject_stat.stat.exists | default(false))
          - not (guardian_scan_available | bool)
          - guardian_scan_skip_reason == "ai-guardian not installed"
          - _guardian_scan_host == inventory_hostname
        fail_msg: >-
          review_guardian_binary was interpolated into sh -c. Marker
          exists={{ _inject_stat.stat.exists | default('undefined') }},
          skip_reason={{ guardian_scan_skip_reason | default('undefined') }}
        success_msg: "Guardian binary name is not interpolated into sh -c."

    - name: Clean up the marker if a regression created it
      ansible.builtin.file:
        path: "{{ _inject_marker.path }}"
        state: absent
