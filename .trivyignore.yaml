# Fixable highs the image cannot clear. The gate stays HIGH,CRITICAL with
# ignore-unfixed and exit-code 1. Each entry has an expiry, so a stale
# entry fails the publish instead of hiding a new advisory.
vulnerabilities:
  # cursor-sdk 1.0.37 and 1.2.0 vendor undici 5.29.0 and @fastify/busboy
  # 2.1.1 in the bridge they run on their own bundled node. No cursor-sdk
  # release vendors fixed copies.
  - id: CVE-2026-19481
    paths:
      - usr/local/lib/python3.12/site-packages/cursor_sdk/_vendor/bridge/node_modules/@fastify/busboy/package.json
    purls:
      - pkg:npm/%40fastify/busboy@2.1.1
    statement: upstream-vendored, no fix we can apply
    expired_at: 2026-11-30
  - id: CVE-2026-109383
    paths:
      - usr/local/lib/python3.12/site-packages/cursor_sdk/_vendor/bridge/node_modules/undici/package.json
    purls:
      - pkg:npm/undici@5.29.0
    statement: upstream-vendored, no fix we can apply
    expired_at: 2026-11-30
  - id: CVE-2026-12151
    paths:
      - usr/local/lib/python3.12/site-packages/cursor_sdk/_vendor/bridge/node_modules/undici/package.json
    purls:
      - pkg:npm/undici@5.29.0
    statement: upstream-vendored, no fix we can apply
    expired_at: 2026-11-30
  - id: CVE-2026-1526
    paths:
      - usr/local/lib/python3.12/site-packages/cursor_sdk/_vendor/bridge/node_modules/undici/package.json
    purls:
      - pkg:npm/undici@5.29.0
    statement: upstream-vendored, no fix we can apply
    expired_at: 2026-11-30
  - id: CVE-2026-87018
    paths:
      - usr/local/lib/python3.12/site-packages/cursor_sdk/_vendor/bridge/node_modules/undici/package.json
    purls:
      - pkg:npm/undici@5.29.0
    statement: upstream-vendored, no fix we can apply
    expired_at: 2026-11-30
  # pip 26.3 still vendors pkg_resources from setuptools 70.3.0. The
  # advisory is in setuptools.package_index, which pip does not vendor and
  # the installed setuptools 84.2.1 no longer ships.
  - id: CVE-2025-47273
    purls:
      - pkg:pypi/setuptools@70.3.0
    statement: vulnerable module not present in the image
    expired_at: 2026-11-30
