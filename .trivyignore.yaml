# Fixable highs the image cannot clear. The gate stays HIGH,CRITICAL with
# ignore-unfixed and exit-code 1. Each entry has an expiry, so a stale
# entry fails the publish instead of hiding a new advisory.
vulnerabilities:
  # pip 26.3 still vendors pkg_resources from setuptools 70.3.0. The
  # advisory is in setuptools.package_index, which pip does not vendor and
  # the installed setuptools 84.2.1 no longer ships.
  - id: CVE-2025-47273
    purls:
      - pkg:pypi/setuptools@70.3.0
    statement: vulnerable module not present in the image
    expired_at: 2026-11-30
