---
# Execution environment for review.yml on AAP.
#
# Published image: ghcr.io/aknochow/plaibook-ee
# Multi-arch (linux/amd64, linux/arm64). Tags :main and :latest follow
# main. A release tag vX.Y.Z publishes :X.Y.Z.
#
# Base: registry.access.redhat.com/hi/python:3.12-builder, pinned by the
# multi-arch index digest. The runtime hi/python image has no /bin/sh, and
# Ansible runs every task through /bin/sh, so this is the -builder variant.
# The image defaults to uid 65532. ansible-builder switches to root for the
# build stages and leaves the final image as uid 1000, which AAP accepts.
# package_manager_path is /usr/bin/dnf (dnf5). python_path is
# /usr/bin/python3 (Python 3.12). Do not install the python3-pip RPM: on
# this Hummingbird repo that package depends on the python3 RPM, which is
# Python 3.14 and would replace the interpreter. ansible-builder installs
# pip for 3.12 with ensurepip.
#
# Collections are the git pins in collections-requirements.yml. Python
# dependencies are the exact pins in execution-environment-requirements.txt,
# installed with pip --require-hashes. ssh_proxy.py and OpenShell certs
# are not in the image. gh 2.103.3 is built from its release tag with
# golang.org/x/net raised to v0.62.0 (CVE-2026-78661; the release binary
# has v0.60.0). glab 1.126.0 is the vendor RPM, checked by per-arch
# SHA-256 before install.
#
# Build from a clean checkout. --squash all is required: the Hummingbird
# base is 32 filesystem layers, and Podman with metacopy=on cannot mount
# that stack plus the layers this build adds.
#   ansible-builder build --squash all -t ghcr.io/aknochow/plaibook-ee:latest -f execution-environment.yml

version: 3

images:
  base_image:
    name: registry.access.redhat.com/hi/python:3.12-builder@sha256:d0c20fb11396ef2486bb80ee94fb82fd0a4c989d51ccb04d65754be5dbd6044b

options:
  package_manager_path: /usr/bin/dnf
  # AAP runs Execution Environments as a non-root user. 1000 is the user
  # ansible-builder and AAP both accept. relax_passwd_permissions lets an
  # arbitrary OpenShift UID rewrite /etc/passwd at start.
  user: "1000"
  relax_passwd_permissions: true
  workdir: /runner

dependencies:
  python_interpreter:
    python_path: /usr/bin/python3
  # ansible-builder runs `pip install $ANSIBLE_INSTALL_REFS` in the base
  # stage, before galaxy. That string is the hashed lock, not a version
  # range. ansible-runner is in the same file.
  ansible_core:
    package_pip: "--require-hashes -r /tmp/ee-requirements.txt"
  # Same file the collection pin-bump workflow maintains.
  galaxy: collections-requirements.yml
  python: execution-environment-requirements.txt
  # Collection requirements.txt files are ranges. Drop them so introspect
  # cannot install those ranges beside the lockfile.
  exclude:
    python:
      - anthropic
      - claude-agent-sdk
      - google-genai
      - openai
      - cursor-sdk
      - xai-sdk
      - openshell
      - grpcio
      - protobuf
      - kubernetes
      - requests-oauthlib
      - jsonpatch

additional_build_steps:
  # git has to be present before the galaxy stage clones the pin file.
  # The final stage is FROM this base, so these packages stay in the image.
  prepend_base:
    - RUN $PKGMGR install -y git tar openssh-clients jq
    - COPY _build/requirements.txt /tmp/ee-requirements.txt
  prepend_builder:
    - ENV PIP_OPTS="--require-hashes"
  append_final:
    - LABEL org.opencontainers.image.source="https://github.com/aknochow/ansible-plaibook"
    # gh 2.103.3 from source. The release RPM embeds golang.org/x/net
    # v0.60.0 (CVE-2026-78661, fixed in v0.62.0), and gh trunk is still
    # below the fix. The Go archive is checked by SHA-256, the clone by the
    # tag's commit, and modules by go.sum and sum.golang.org. The build
    # fails unless the binary reports x/net v0.62.0. The base has no gzip,
    # so Python's tarfile unpacks the archive. Go, the source, and
    # the module cache are removed in the same step. Drop this for the
    # vendor RPM once a gh release ships x/net v0.62.0 or later.
    - |
      RUN set -eu; \
          arch="$(uname -m)"; \
          case "$arch" in \
            x86_64) go_arch=amd64; go_sum=65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40 ;; \
            aarch64) go_arch=arm64; go_sum=a06e99309dbcbdca1a8ccd2282c3ee146e55930886e26b4f1193269587165f49 ;; \
            *) echo "unsupported architecture ${arch}" >&2; exit 1 ;; \
          esac; \
          curl -fsSL -o /tmp/go.tar.gz "https://go.dev/dl/go1.27.3.linux-${go_arch}.tar.gz"; \
          echo "${go_sum}  /tmp/go.tar.gz" | sha256sum -c -; \
          /usr/bin/python3 -c 'import tarfile; tarfile.open("/tmp/go.tar.gz").extractall("/tmp", filter="data")'; \
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch v2.103.3 https://github.com/cli/cli /tmp/gh-src; \
          test "$(git -C /tmp/gh-src rev-parse HEAD)" = 63837fb778d6a39f02be0ce76ff89f2bc8d74bdc; \
          export PATH="/tmp/go/bin:${PATH}" GOTOOLCHAIN=local CGO_ENABLED=0 GOPATH=/tmp/gopath GOCACHE=/tmp/gocache; \
          cd /tmp/gh-src; \
          go get golang.org/x/net@v0.62.0; \
          go mod verify; \
          go build -trimpath -ldflags "-s -w -X github.com/cli/cli/v2/internal/build.Version=2.103.3" -o /usr/bin/gh ./cmd/gh; \
          go version -m /usr/bin/gh | grep -Eq '^[[:space:]]+dep[[:space:]]+golang.org/x/net[[:space:]]+v0\.62\.0[[:space:]]'; \
          cd /; \
          rm -rf /tmp/go /tmp/go.tar.gz /tmp/gh-src /tmp/gopath /tmp/gocache
    # GitLab's generic RPM is unsigned. Hummingbird rpm rejects it, so the
    # install checks the pinned digest and then uses --nosignature.
    # 1.126.0 is Go 1.27.3.
    - 'RUN arch="$(uname -m)"; case "$arch" in x86_64) rpm_arch=amd64; sum=ea476312a97fc93d0ddefbfe7f6adaf1c184b1993cca8d8a33b424c08e9326fe ;; aarch64) rpm_arch=arm64; sum=6755dc3d2c387510ff0b234470e54bf93a26dc525f93eb63c5c71018acc37d50 ;; *) echo "unsupported architecture ${arch}" >&2; exit 1 ;; esac; curl -fsSL -o /tmp/glab.rpm "https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/packages/generic/glab/1.126.0/glab_1.126.0_linux_${rpm_arch}.rpm" && echo "${sum}  /tmp/glab.rpm" | sha256sum -c - && rpm -i --nosignature /tmp/glab.rpm && rm -f /tmp/glab.rpm'
