[defaults]
# Resolved relative to this file's own location (repo root), so role
# resolution works the same regardless of which subdirectory the
# invoked playbook itself lives in (e.g. tests/*.yml) — Ansible's
# default role search path is relative to the PLAYBOOK's own
# directory, not the CWD you invoke it from, which broke every
# tests/*.yml playbook using include_role until this was added.
roles_path = roles

# Shared action plugins used by roles/review's deterministic
# business-logic layer (see handoff.ansible-plaibook-action-plugin-full-
# migration-roadmap.yaml's decide-action-plugin-location item). NOT
# role-local (roles/review/action_plugins/) on purpose: role-local
# action plugins only resolve while that specific role is "in play." At
# the time this was decided, roles/code_review + roles/review were two
# separate roles planned to eventually merge into one
# (handoff.ansible-plaibook-role-consolidation.yaml's deferred follow-up,
# since resolved by that merge) -- a role-local plugin would have
# stopped resolving entirely once code_review stopped existing as a
# role, not just needed a path rename. A config-registered top-level
# directory is unaffected by that kind of role restructuring regardless
# of what a role ends up named or when it changes shape -- this proved
# out exactly as intended when the merge actually happened. This does
# NOT affect built-in Ansible modules (set_fact, assert, etc. resolve
# via a separate mechanism) or replace anything -- it's an additional
# search path, same pattern as roles_path above.
action_plugins = action_plugins

# A genuine Ansible MODULE search path, not another action_plugins
# entry -- rebuild-checklist-execution (action-plugin-full-migration-
# roadmap.yaml) needs delegate_to: review_delegate_host to actually
# execute its worktree/allowlist/teardown lifecycle ON the delegated
# host (which "may be a sandbox" per
# handoff.ansible-plaibook-coordinator-setup-rebuild-design.yaml -- this is
# the whole point: checklist commands are derived from untrusted
# PR-branch content). Every other plugin in this migration is an
# ActionModule with _requires_connection = False, which ALWAYS runs on
# the controller regardless of delegate_to -- correct for those (pure
# functions, no I/O), but wrong here: it would silently execute
# untrusted, allowlisted-but-still-attacker-influenced commands on the
# operator's own machine instead of the sandbox. A real module (copied
# to and executed on whichever host delegate_to resolves to, via
# Ansible's normal connection-plugin machinery) is the only way this
# migration's plugin pattern actually respects that boundary.
library = library

stdout_callback = default
callbacks_enabled = ansible.posix.profile_tasks, ansible.posix.timer
# community.general.yaml was here, but that plugin was removed in
# community.general 12.0.0 and collections-requirements.yml doesn't pin
# a version -- any unpinned install newer than that breaks this outright.
# ansible.builtin.default + callback_result_format=yaml (below) is the ansible-core-
# native replacement the removal's own error message points to, with no
# collection-version dependency at all.
callback_result_format = yaml

# Machine-specific Python interpreter override does NOT belong here:
# interpreter_python has no effect for connection: local playbooks
# (which is how every playbook in this repo runs) — see
# host_vars/localhost.yml's ansible_python_interpreter instead, which
# is the setting that actually takes effect. That file stays
# gitignored/per-developer; this file is now portable and committed.

[ssh_connection]
# Ansible's own factory default ssh_args is
# "-C -o ControlMaster=auto -o ControlPersist=60s" -- the -C
# (compression) breaks the sandbox connection outright. OpenShell
# sandboxes run a russh (Rust SSH) server, not OpenSSH; negotiating
# zlib compression with it and then executing a command hangs the
# channel until the remote side drops the connection with "Connection
# to <sandbox> closed by remote host" / "Broken pipe" -- confirmed by
# reproducing the exact failure with a bare `ssh -C` against a live
# sandbox and watching it vanish the instant `-C` is added, working
# fine every time without it. Keep ControlMaster/ControlPersist (that
# part isn't the problem, and dropping it would slow down every
# per-task connection to the sandbox) but never negotiate compression.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
