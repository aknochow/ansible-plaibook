---
# Git sources rather than local dir paths — this needs to resolve from
# any machine (an AAP Execution Environment build, a fresh clone),
# not just this laptop. Both are personal projects, public on GitHub.
collections:
  - name: https://github.com/aknochow/ansible-openshell.git
    type: git
    version: main
  - name: https://github.com/aknochow/ansible-claude.git
    type: git
    version: main
  - name: https://github.com/aknochow/ansible-openai.git
    type: git
    # Pin the interface this role calls; moving main can silently change
    # module argument names and break every OpenAI review at runtime.
    version: 60a9cc192b12867c4234c6eaad6b256460f550d5
  - name: https://github.com/aknochow/ansible-cursor.git
    type: git
    # Pin the interface this role calls (effort mapping, structured_tool
    # / mcp coupling). Moving main can silently change module arguments.
    version: 6d5998c0e9a94238ef5c9400bd53aa08dc25f370
  # community.general.jira — the native Jira module bug_context uses
  # to fetch/comment on tickets, replacing hand-rolled ansible.builtin.uri
  # calls against the REST API directly.
  - name: community.general
  # kubernetes.core.k8s_info — roles/review/tasks/fetch_k8s_secret_tls.yml's
  # sandbox_tls_source: k8s_secret path (AAP unattended automation).
  - name: kubernetes.core
  # ansible.posix.profile_tasks and ansible.posix.timer callbacks in ansible.cfg.
  - name: ansible.posix
