---
# pr | branch | commit. Selects which resolve_target_*.yml task file
# tasks/main.yml dispatches to. Matches review.yml's own play-level
# default, set here too so including this role directly, without
# review.yml, fails with review.yml's own documented default instead
# of a confusing empty-string assert error.
review_type: pr

# Gate: reviewing is safe to automate, posting to a real PR/MR is a
# write to shared state and requires explicit opt-in. Only meaningful
# for review_type: pr.
post_results: false

# Gate: query target PR/MR CI status before dispatching lens agents.
# When true, if CI is failing on the PR head commit, stop and report early
# (verdict: SKIPPED) instead of dispatching lenses and incurring model spend
# on known-broken code. If no CI checks exist (ci_status: none), or if checks
# are running or passing, review proceeds normally.
# Override via -e review_require_ci_passing=false to review anyway.
review_require_ci_passing: true

review_delegate_host: ""

# resolve_target_pr.yml's clone fetches via GitHub/GitLab's ref mirror
# (refs/pull/N/head, refs/merge-requests/N/head), which is populated
# asynchronously after a push and can lag the real HEAD by a couple of
# minutes. verify_target_freshness.yml polls the platform API for that
# long, worst case, before failing loudly. Overridable so tests can
# shrink the window instead of waiting it out for real.
review_freshness_check_retries: 6
review_freshness_check_delay: 30

# Only meaningful for review_type: branch, and only for local targets:
# explicit branch to check out in the isolated clone. Remote targets
# (GitHub/GitLab) get their branch from the target string itself
# (org/repo@branch or a /tree/ URL); a local target with no branch
# given here just reviews whatever HEAD the source repo currently has
# checked out.
branch_review_branch: ""

review_agent_model: "claude-opus-4-6"

# Per-task-config-var provider selection for lens dispatch (see
# AGENTS.md's "Per-task-config-var for multi-provider dispatch" --
# decided, don't re-litigate: no generic abstraction-class layer).
# roles/review/tasks/lenses.yml (and retry_lens_dispatch.yml,
# verify_continuity_audit.yml) include_tasks
# "dispatch_lens_{{ agent_family }}.yml"/"dispatch_verify_continuity_
# audit_{{ agent_family }}.yml" -- one hand-written, provider-native
# task file per family, never a shared abstraction. claude is default
# so existing behavior/callers are unchanged. qwen isn't implemented
# yet (only claude/gemini/claude_cli dispatch files exist) -- named
# here so it slots in later without a rename, per
# ansible-agentbench/harness/tier1_lens_dispatch.yml's own precedent
# (that harness already proves a Qwen path via aknochow.openai.chat).
# claude_cli dispatches via aknochow.claude.agent (claude-agent-sdk,
# the library behind the `claude` CLI) instead of dispatch_lens_claude.yml's
# raw Messages API call -- draws on a claude.ai Pro/Max subscription's
# own OAuth session rather than per-token API credits. See
# dispatch_lens_claude_cli.yml's own header for the full rationale.
# Env-overridable so a machine with no ANTHROPIC_API_KEY can set its own
# default once (ANSIBLE_REVIEW_AGENT_FAMILY, or agent_family in a
# gitignored host_vars/localhost.yml) instead of remembering -e on every
# invocation. The `true` second argument matters: an unset env lookup
# returns the empty string, not undefined, and bare default() only
# triggers on undefined.
#
# 'claude' stays the fallback rather than becoming a considered choice --
# changing it is a separate decision, not a side effect of making the
# var overridable.
# claude | gemini | claude_cli | qwen
agent_family: "{{ lookup('ansible.builtin.env', 'ANSIBLE_REVIEW_AGENT_FAMILY') | default('claude', true) }}"

# aknochow.claude auth: no provider or project baked in on purpose --
# this role doesn't get to assume which backend you use. Falls back to
# omit when unconfigured, so aknochow.claude's own argspec defaults/
# env fallback (provider defaults to "anthropic", ANSIBLE_CLAUDE_PROVIDER/
# ANTHROPIC_API_KEY env vars) take over unchanged. Override any of
# these via extra_vars, or set them once in your own gitignored
# host_vars/localhost.yml if you always use the same provider.
claude_provider: "{{ lookup('ansible.builtin.env', 'ANSIBLE_CLAUDE_PROVIDER') | default(omit, true) }}"
claude_vertex_region: "{{ lookup('ansible.builtin.env', 'ANTHROPIC_VERTEX_REGION') | default('global', true) }}"
claude_vertex_project: "{{ lookup('ansible.builtin.env', 'ANTHROPIC_VERTEX_PROJECT_ID') | default(omit, true) }}"
claude_api_key: "{{ lookup('ansible.builtin.env', 'ANTHROPIC_API_KEY') | default(omit, true) }}"

# aknochow.gemini auth, mirrors claude_provider/claude_api_key above.
# backend defaults to "api" (aknochow.gemini's own argspec default) so
# a bare `-e agent_family=gemini` works off GEMINI_API_KEY/GOOGLE_API_KEY
# alone -- no Vertex project/location required, matching the AI Studio
# free-tier dogfooding use case this was added for.
gemini_backend: "{{ lookup('ansible.builtin.env', 'ANSIBLE_GEMINI_BACKEND') | default('api', true) }}"
gemini_vertex_project: "{{ lookup('ansible.builtin.env', 'GOOGLE_CLOUD_PROJECT') | default(omit) }}"
gemini_vertex_location: "{{ lookup('ansible.builtin.env', 'GOOGLE_CLOUD_LOCATION') | default(omit) }}"
gemini_api_key: "{{ lookup('ansible.builtin.env', 'GEMINI_API_KEY') | default(lookup('ansible.builtin.env', 'GOOGLE_API_KEY'), true) | default(omit, true) }}"
# gemini-3.6-flash is the DEFAULT because it is the model actually
# validated end-to-end here (corpus case 005, 2026-08-24: correct
# Critical finding at app/cache.py:5, at both minimal and high effort).
#
# gemini-3.7-flash is NOT the default despite being newer: it returned
# 503 UNAVAILABLE ("this model is currently experiencing high demand")
# on two separate attempts on the AI Studio free tier, through the
# SDK's own retries, and has never completed a review run here. That is
# a free-tier capacity signal, not a quality judgement -- it may well be
# the better model, and the pending benchmark comparison is what should
# decide that. Opt in with -e review_gemini_model=gemini-3.7-flash once
# it is reachable; it is also deliberately unpriced in agent_pricing,
# so compute_pipeline_cost.py flags it rather than guessing a rate.
review_gemini_model: "{{ lookup('ansible.builtin.env', 'ANSIBLE_REVIEW_GEMINI_MODEL') | default('gemini-3.6-flash', true) }}"

# Explicit, not inherited-by-omission: aknochow.gemini's own thinking_budget
# default is 0, but on backend=api that means "no thinking_config sent at
# all" (the Developer API rejects an explicit 0), which lets the model's
# own default thinking apply instead -- verified live to be ON for at
# least one thinking-capable model (see ansible-gemini's generate.py
# DOCUMENTATION for thinking_budget, and its 2026-08-24 commit fixing the
# vertex/api split). Leaving this unset here would silently reproduce
# that exact ambiguity for every lens dispatch: max_output_tokens would
# stop being a visible-output-only budget, and thinking tokens would
# burn part of it without ever being returned or counted.
#
# minimal is the deliberate default, not a guess: report_findings is a
# schema-constrained single-shot structured-output call (Security/Review
# lenses, continuity audit) with a well-specified rubric already spelled
# High by default: review quality is the point of this pipeline, and a
# thinking-capable model reasoning harder about a diff is exactly where
# the extra tokens earn their keep. Measured on corpus case 005
# (2026-08-24, gemini-3.6-flash): minimal spent 0 thinking tokens and
# returned 371 visible; high spent 3251 and returned 213. Both found
# the same Critical finding, so this is a cost/headroom tradeoff, not a
# correctness one -- but the squeeze on visible output is real, which is
# why review_gemini_max_output_tokens below is raised rather than left
# at the 8192 the minimal-effort default was sized for. On the AI Studio
# free tier the extra thinking tokens cost nothing.
#
# Override per run (e.g. a benchmark comparison sweeping this value
# against finding quality/recall) via -e review_gemini_thinking_level=<level>.
review_gemini_thinking_level: "{{ lookup('ansible.builtin.env', 'ANSIBLE_REVIEW_GEMINI_THINKING_LEVEL') | default('high', true) }}"

# Raised from the 8192 used before thinking_level defaulted to high.
# thinking_budget and visible output share this ceiling on Gemini, and
# truncation is SILENT -- a squeezed response loses findings with no
# error -- so the budget has to cover both. Claude's own dispatch keeps
# max_tokens: 8192 because its extended thinking is not enabled on this
# path, so nothing competes with visible output there.
review_gemini_max_output_tokens: "{{ lookup('ansible.builtin.env', 'ANSIBLE_REVIEW_GEMINI_MAX_OUTPUT_TOKENS') | default(16384, true) | int }}"

# Wall-clock ceiling for a single Gemini call, passed to
# aknochow.gemini.generate's own `timeout`.
#
# The collection defaults to 120s with max_retries: 2, so a slow call
# burns 3 x 120s and fails at ~6 minutes. That was enough for
# corpus-sized cases but not for a real pull request: reviewing a live
# PR timed out on verify turn 3 at exactly 6:02, having spent the whole
# budget on retries that were never going to be faster than the first
# attempt.
#
# 300 rather than the module's 120 because a verify turn runs at
# review_gemini_thinking_level (high by default) over a full diff, and
# a timeout here discards every prior stage of the run.
review_gemini_timeout: "{{ lookup('ansible.builtin.env', 'ANSIBLE_REVIEW_GEMINI_TIMEOUT') | default(300, true) | float }}"

# aknochow.claude.agent auth for agent_family=claude_cli: no
# ANTHROPIC_API_KEY/provider config here on purpose, mirroring
# claude_provider/claude_api_key above -- dispatch_lens_claude_cli.yml
# clears ANTHROPIC_API_KEY on its own module tasks instead (see that
# file's header) so the underlying `claude` CLI subprocess falls back
# to whatever subscription OAuth session is already set up on the
# host, which is the entire point of this dispatch path.
#
# No model baked in on purpose, same reasoning as claude_provider
# above (AGENTS.md: "Never bake in a default choice that assumes a
# specific backend/provider/environment"): which models a given
# claude.ai subscription tier can actually reach varies (confirmed
# live, agent.py's own notes: the account used to build this module
# reported subscriptionType "Claude Pro"), so this role doesn't get to
# assume claude-opus-4-6 (review_agent_model's own default, priced for
# API billing) is even reachable. Left unset, aknochow.claude.agent
# falls back to the CLI's own default model. Override with
# -e review_claude_cli_model=<model> once you know what your
# subscription can reach.
review_claude_cli_model: "{{ lookup('ansible.builtin.env', 'ANSIBLE_REVIEW_CLAUDE_CLI_MODEL') | default(omit, true) }}"

# high by default, same "review quality is the point of this pipeline"
# reasoning as review_gemini_thinking_level above. Unlike Gemini's
# thinking_level, this rides on subscription usage rather than
# per-token billing, so there is no direct dollar cost to weigh against
# quality here -- only subscription rate-limit headroom, which the
# operator is better placed to judge than a baked-in default.
review_claude_cli_effort: "{{ lookup('ansible.builtin.env', 'ANSIBLE_REVIEW_CLAUDE_CLI_EFFORT') | default('high', true) }}"

# [] is the module's own default too, but set explicitly here rather
# than left to inherit it -- this is a review-integrity setting, not
# just a token-cost one, so it belongs in this role's own defaults
# where it is visible and reviewable, not just in agent.py's argspec.
# Confirmed live (agent.py's own setting_sources docs): leaving this
# unset loads the reviewed repo's own CLAUDE.md/skills into the
# reviewing session's context -- ~234 input tokens with [] vs. ~2,485
# with everything loaded on the same call. Beyond the token cost, a
# repo being reviewed should never get to steer its own review by
# shipping instructions in its own CLAUDE.md. Not env-lookup-backed
# like the vars above: this is a security-relevant default, not a
# per-host preference, so changing it is a deliberate -e override, not
# something to leave sitting in an environment variable.
review_claude_cli_setting_sources: []

# >= 2 whenever output_format is set (which every dispatch_lens_claude_cli.yml
# call does) -- confirmed live (agent.py's own max_turns/output_format
# docs): Claude can decline the structured-output tool call on its
# first turn and needs a retry turn to try again; with max_turns: 1 the
# SDK raises error_max_turns instead of failing cleanly. 2 is the
# floor, not a generous budget -- raise it if declines are still
# common after that.
review_claude_cli_max_turns: "{{ lookup('ansible.builtin.env', 'ANSIBLE_REVIEW_CLAUDE_CLI_MAX_TURNS') | default(2, true) | int }}"

# Wall-clock ceiling for a single claude_cli lens call, passed to
# aknochow.claude.agent's own `timeout`.
#
# The module defaults to 300s, which is half what this pipeline already
# allows the Messages API path (dispatch_lens_claude.yml uses async:
# 600) -- and the CLI path is the slower of the two: it spawns a
# subprocess, and runs with thinking enabled at review_claude_cli_effort
# (high by default). Reviewing a ~1200-line diff exceeded 300s and the
# module correctly aborted rather than hanging the play, so the default
# was simply too tight for a real PR rather than a corpus-sized case.
#
# 900 not 600: the CLI has subprocess startup on top of the same model
# work, and a timeout here wastes the whole run's prior stages.
review_claude_cli_timeout: "{{ lookup('ansible.builtin.env', 'ANSIBLE_REVIEW_CLAUDE_CLI_TIMEOUT') | default(900, true) | float }}"

review_output_base: "{{ lookup('env', 'HOME') }}/reviews"

# Append-only JSONL ledger of every run: one object per line carrying
# model, tokens, cost, verdict and score. Each last_run.<id>.json is a
# single-run snapshot, so nothing accumulated across runs until this
# existed -- making spend-to-date and score-over-time both unanswerable
# without scraping the cache by hand.
review_run_ledger_enabled: "{{ lookup('ansible.builtin.env', 'ANSIBLE_REVIEW_RUN_LEDGER') | default(true, true) | bool }}"
# Per-HOST ledger file, not one shared file. Two machines appending to
# the same path would conflict on every merge; appending to their own
# never conflicts at all, and reading is just `cat ledger/*.jsonl`.
# Attribution comes free from the filename.
#
# Default stays machine-local so a fresh clone works with no setup.
# Point it at a git-backed directory to combine machines, e.g.:
#   -e review_run_ledger_dir=/path/to/ansible-agentbench-data/ledger
# Git rather than object storage on purpose: the data is tiny, `gh` auth
# already works everywhere, it is diffable and versioned, and object
# stores have no append operation -- a read-modify-write from two
# machines silently loses entries.
review_run_ledger_dir: "{{ lookup('ansible.builtin.env', 'ANSIBLE_REVIEW_RUN_LEDGER_DIR') | default(lookup('env', 'HOME') ~ '/.cache/ansible-plaibook/ledger', true) }}"
review_run_ledger_host: "{{ lookup('ansible.builtin.env', 'ANSIBLE_REVIEW_RUN_LEDGER_HOST') | default(lookup('pipe', 'hostname -s'), true) | lower | regex_replace('[^a-z0-9_.-]', '-') }}"
review_run_ledger_path: "{{ review_run_ledger_dir }}/{{ review_run_ledger_host }}.jsonl"

# Kill switch for briefing.yml's same-commit fast path: set false to
# force every run through the full lens/merge/explore/verify dispatch
# regardless of whether a prior review is found matching the current
# commit, e.g. to recover from a bad cached review without deleting
# review_output_base by hand.
review_same_commit_fast_path_enabled: true

review_context: ""

# Both normally always set for real by briefing.yml (review_full_diff
# from the actual diff, review_prior_review_md from
# find_latest_prior_review.py when a prior round exists). These
# role-default empty strings only matter for a caller that runs
# merge.yml standalone, skipping briefing.yml entirely.
review_full_diff: ""
review_prior_review_md: ""

# Off by default: an on-demand debugging aid, not a production
# artifact. When true, every rendered lens/explore/verify system prompt
# is written to ~/.cache/ansible-plaibook/debug_prompts/<review_branch>/
# so you can directly inspect what an agent actually saw, including
# exactly where review_extra_notes landed, without reading Jinja
# templates and inferring. Overwritten every run for the same target.
review_debug_dump_prompts: false

# Writes a second copy of the findings report into the checkout itself
# for CI consumption, see persist.yml's header comment. Defaults on
# since it's a plain additive file write with no effect on the
# reviewer-history path.
review_write_artifact: true

# Pattern: code-review_<repo-branch>_job<N>.md. review_branch already
# uniquely identifies platform+org/repo+PR number (e.g.
# "github-aknochow-ogo-35"), so it covers "repo and branch" without
# re-embedding review_org_repo a second time. tower_job_id/awx_job_id
# are auto-injected by the AAP Controller into every job; the _jobN
# suffix is appended automatically when present so multiple CI job
# runs against the same target don't overwrite each other's artifact
# in a reused/shared checkout, omitted entirely when run outside AAP.
# "job" + the number, not a literal '#', avoids shell-quoting
# headaches in a filename. review_branch is slash-free for
# resolve_target_pr.yml callers, but review_type: commit sets it to
# the raw git branch name (e.g. "feat/foo"), so regex_replace here
# keeps a literal "/" from turning into a path segment.
review_artifact_filename: >-
  {{ 'code-review_' ~ (review_branch | regex_replace('/', '-')) ~
     (('_job' ~ (tower_job_id | default(awx_job_id))) if (tower_job_id is defined or awx_job_id is defined) else '')
     ~ '.md' }}

# tasks/explore.yml: a bounded, sequential agent pass after the lenses
# merge, that can look beyond the diff (stale docs, other call sites of
# a changed identifier) before the report is finalized. Opt-out knob,
# same pattern as use_sandbox: set false to skip it entirely and keep
# the cheaper, lens-only behavior.
review_explore_enabled: true
# 3, not 4: a model that has already found what it needs by turn 2
# tends to keep exploring until forced to conclude on the last allowed
# turn, so turn 4 tends to be pure unused cost.
review_explore_max_turns: 3
# Separate from review_agent_model: explore's job (decide whether
# something needs checking, do a simple read/grep, report) is a much
# lighter task than the lenses' full diff review, and a cheaper model
# may do it just as well.
review_explore_model: "{{ review_agent_model }}"
# Gemini equivalent of review_explore_model above. Defaults to
# review_gemini_model, matching the Claude side's default to
# review_agent_model.
review_explore_gemini_model: "{{ lookup('ansible.builtin.env', 'ANSIBLE_REVIEW_EXPLORE_GEMINI_MODEL') | default(review_gemini_model, true) }}"
# claude_cli equivalent of review_explore_model/review_explore_gemini_model
# above, used by dispatch_explore_turn_attempt_claude_cli.yml. Left unset,
# aknochow.claude.agent falls back to the CLI's own default model, same as
# review_claude_cli_model.
review_explore_claude_cli_model: "{{ lookup('ansible.builtin.env', 'ANSIBLE_REVIEW_EXPLORE_CLAUDE_CLI_MODEL') | default(omit, true) }}"

# claude_cli equivalent of review_explore_max_turns (3), sized for a single
# module call running its own internal Read/Grep/Glob exploration loop, matching
# review_verify_claude_cli_max_turns's rationale.
review_explore_claude_cli_max_turns: "{{ lookup('ansible.builtin.env', 'ANSIBLE_REVIEW_EXPLORE_CLAUDE_CLI_MAX_TURNS') | default(25, true) | int }}"

# tasks/verify.yml: an independent, adversarial re-check of Critical/
# Major findings' checkable factual claims (SDK signatures, stdlib
# defaults, stated invariants, other call sites), runs after
# explore.yml so it audits the fully-final findings set. Opt-out knob,
# same pattern as review_explore_enabled.
review_verify_enabled: true
review_verify_severities: ["Critical", "Major"]
# review_verify_severities alone would miss a truly-Critical finding
# misclassified down to Minor, which would never reach verification at
# all, the more dangerous direction. A Minor finding also gets pulled
# into scope when it was raised by the Security lens, or when its
# file/description/evidence matches this pattern.
#
# Deliberately flat alternation, no nested/repeated quantifiers: if
# you override this, keep it that way. Python's re module has no
# built-in match timeout, so a pattern with catastrophic-backtracking
# potential run against attacker-influenced content (finding
# file/description/evidence ultimately trace back to diff content) has
# no runtime backstop here.
review_verify_security_sensitive_pattern: "(?i)(password|secret|token|credential|api[_-]?key|auth|inject|traversal|sanitiz|escape|deserial|pickle|eval\\(|exec\\(|subprocess|shell=True|os\\.system|sudo|ssh|tls|ssl|cert|encrypt|decrypt|permission|privilege|sandbox|rce|ssrf|xss|csrf|symlink|race condition|prompt injection)"  # noqa: yaml[line-length]
# 3, not lower: a single finding can still need more than one
# read/search round-trip (e.g. finding every call site of a shared
# helper before concluding a suggested fix is safe).
review_verify_max_turns: 3
# Deliberately cheap by default, unlike review_explore_model: this
# task is narrower and more mechanical than deciding whether a whole
# diff needs checking, and an N-findings x M-turns cost multiplier
# makes an expensive default too costly to run on every review.
review_verify_model: "claude-haiku-4-5"
# Gemini equivalent of review_verify_model above -- same "verify can be
# cheaper than the lens pass" intent, applied to agent_family=gemini.
# gemini-3.5-flash rather than review_gemini_model's gemini-3.6-flash:
# the older/smaller flash tier, mirroring claude-haiku-4-5 being a
# smaller/cheaper model than the lens dispatch's own claude model.
# Used by both dispatch_verify_turn_attempt_gemini.yml (the per-turn
# tool-calling loop) and verify_continuity_audit.yml's Gemini branch
# (a single-shot call, but still logically part of "verify").
review_verify_gemini_model: "{{ lookup('ansible.builtin.env', 'ANSIBLE_REVIEW_VERIFY_GEMINI_MODEL') | default('gemini-3.5-flash', true) }}"

# claude_cli equivalent of review_verify_model/review_verify_gemini_model
# above, used by dispatch_verify_turn_attempt_claude_cli.yml. No baked-in
# cheap-model default here, unlike review_verify_model's claude-haiku-4-5:
# review_claude_cli_model already has no default for the same reason
# (which models a given claude.ai subscription tier can actually reach
# varies -- see that var's own comment), and that reasoning applies
# identically to whatever cheaper model verify might want to use here.
# Left unset, aknochow.claude.agent falls back to the CLI's own default
# model, same as review_claude_cli_model.
review_verify_claude_cli_model: "{{ lookup('ansible.builtin.env', 'ANSIBLE_REVIEW_VERIFY_CLAUDE_CLI_MODEL') | default(omit, true) }}"

# NOT the same knob as review_claude_cli_max_turns (2), and deliberately
# much larger -- see dispatch_verify_turn_attempt_claude_cli.yml's own
# header for why. That default is sized for lenses.yml's single-shot,
# no-exploration dispatch; this file's single module call has to fit an
# entire explore-then-verdict loop (real Read/Grep/Glob tool calls, ANY
# of the SDK's own retries on non-conforming structured output) inside
# ONE max_turns budget, since plaibook itself no longer drives per-turn
# dispatch under this provider (again, see that file's header for why
# not). Confirmed live (claude-agent-sdk 0.2.144, corpus case 005):
# max_turns=6 was exhausted (error_max_turns) by 4 real exploration
# turns plus two failed/retried StructuredOutput attempts, with no
# verdict ever reached; max_turns=20 succeeded on the first
# StructuredOutput attempt with turns to spare. 25 leaves headroom above
# the smallest value observed to work, not a value tuned to be minimal.
review_verify_claude_cli_max_turns: "{{ lookup('ansible.builtin.env', 'ANSIBLE_REVIEW_VERIFY_CLAUDE_CLI_MAX_TURNS') | default(25, true) | int }}"

# Under this pipeline's forced tool_choice + structured-output
# schemas, a lens model can produce genuinely invalid structured
# output at a non-trivial, probabilistic rate: a different malformed
# shape each attempt, not a deterministic bug tied to one input.
# Without a retry here, a malformed response fails the entire review
# immediately.
#
# 3 (1 initial attempt + 2 retries): retries cost real tokens (a fresh
# dispatch of the exact same call, not a free HTTP poll), and the
# failure is genuinely probabilistic and independent per attempt, so
# each additional attempt multiplies the residual failure probability
# down. A small, bounded number captures most of the benefit without
# unbounded cost on the rare pathological case.
review_structured_output_max_attempts: 3

# tasks/guardian_scan.yml: a deterministic, model-independent scan of
# the shared untrusted diff/PR-description content before it reaches
# either lens, prompt-side only, not response-side. Informational
# only, same non-blocking treatment as this pipeline's other known-
# imperfect signals (the self-refuted-finding filter, citation
# accuracy): ai-guardian's own reproduced false-positive class
# (PROMPT-INJECTION-001 on ordinary Python dunder methods like
# __init__) means this must never feed compute_review_scores.py or
# force a verdict on its own. Opt-out knob, same pattern as
# review_explore_enabled/review_verify_enabled: set false on a host
# without ai-guardian installed rather than let every review fail-open
# silently on a missing binary with no visible signal either way.
review_guardian_scan_enabled: true
# Fixed per-invocation overhead dominates cost regardless of content
# size up to a real-world diff. This cap exists only to keep a
# pathological diff from approaching OS argv-length limits
# (ai-guardian scan --text receives this as a single argv element, not
# stdin/a file), not for scan-cost reasons. Diffs have no other size
# cap before reaching the lenses either.
review_guardian_max_scan_chars: 200000
# Generous relative to the measured scan time; protects against
# ai-guardian hanging on pathological input. A tunable default so
# tests/test_guardian_scan.yml can override it to a tiny value to
# deterministically exercise guardian_scan.yml's rescue path without
# actually needing a real hang.
review_guardian_scan_timeout_seconds: 30

# Version + hash pinning for guardian_scan.yml's own self-install-when-
# missing step (sandboxed reviews only) lives in
# roles/review/files/guardian-ai-guardian-requirements.txt and
# guardian-requests-requirements.txt, not as separate default vars
# here: a version-only var and a hash recorded elsewhere can drift out
# of sync with each other, so a single requirements-with-hashes file
# per package group is the one source of truth for both. See those
# files' own header comments for the regeneration command when
# bumping a version.
#
# Floor for the self-install's pip dependency resolution (which
# package versions are considered), not the sandbox's actual runtime
# Python. See guardian_scan.yml's own comment on the --python-version
# flag for why this must be a realistic modern floor, not left
# unset/bare.
review_guardian_pip_target_python_version: "3.11"
# Generous relative to a real ai-guardian wheel download plus its
# minimal deps; protects the self-install's pip download/install
# commands against a hang (a genuine network partition, not just a
# failure) blocking the whole review indefinitely.
review_guardian_pip_timeout_seconds: 60

# A SECRET-001 finding (a real secret detection, engine-agnostic, not
# gitleaks-specific) forces review_verdict to NEEDS_CHANGES, matching
# how a Critical/Major lens finding already does. Unlike a lens
# finding, this never touches severity_points/compute_review_scores.py's
# score math, only the verdict itself. PROMPT-INJECTION-001 and
# SSRF-001 deliberately stay informational-only, not because they're
# unimportant, but because both have a confirmed, reproducible
# false-positive class on ordinary content this pipeline actually
# scans: PROMPT-INJECTION-001 on Python dunder methods (e.g.
# __init__), SSRF-001 on private-range IPs in test/example code (it
# flags any RFC 1918 range unconditionally, with no test-fixture
# exemption). Blocking on either right now would fail real reviews for
# no real security gain.
#
# A list, not a single hardcoded value, so adding another confirmed-
# reliable blocking category later is a config change, not a code
# change, and so the actual rule_id string lives in exactly one place.
review_guardian_blocking_rule_ids: ["SECRET-001"]
# Separate from review_guardian_scan_enabled (which controls whether
# the scan runs at all): set false to keep scanning and surfacing
# findings without letting any of them force a verdict, independent of
# whether review_guardian_scan_enabled itself is on. Three real
# configurations this pair of toggles produces: scan off entirely,
# scan on but fully informational, and scan on with secrets blocking
# (the default).
review_guardian_scan_blocking_enabled: true

# No shipped default patterns on purpose (see
# check_neutralization_references.py's own docstring): this check
# only makes sense once you supply your own org's real internal
# strings (hostnames, project paths, tool names) to watch for. Example:
# ["gitlab.example.internal", "internal-tool-name"].
review_neutralization_org_patterns: []

# Per-million-token USD rates, keyed by model, for the pipeline-wide
# cost estimate in review.yml's final stats summary. Vertex AI global
# endpoint pricing (avoids the regional-endpoint premium, matches
# region: global above), which mirrors Anthropic's direct API rates.
# cache_write assumes the default 5-minute TTL (1.25x base input);
# cache_read is 0.1x base input. Verify against the current Vertex
# AI/Model Garden pricing page before relying on this for real budget
# decisions: rates change over time and this is not an authoritative
# source. Add an entry here for any other model this role is pointed
# at; a model missing from this table is excluded from the cost total
# and flagged in the final summary rather than silently costed as $0.
#   https://cloud.google.com/blog/products/ai-machine-learning/expanding-vertex-ai-with-claude-opus-4-6
#   https://platform.claude.com/docs/en/about-claude/pricing
#
# Renamed from claude_pricing (Claude-only name) now that this table
# also carries Gemini rates for agent_family=gemini dispatch. Free-tier
# AI Studio usage is $0 but MUST still be counted in tokens -- the
# token ledger stays meaningful even when the dollar cost is zero, see
# pipeline_stats.yml. gemini-3.5-flash's rate is sourced from
# ansible-agentbench/scoring/provider_pricing.yaml (confirmed live
# 2026-08-19) since this repo has no rate of its own yet.
# gemini-3.7-flash (the model actually used for free-tier dogfooding,
# see review_gemini_model) has NO sourced rate here -- it was not
# reliably found on a pricing page during this pass, so it's
# deliberately absent rather than guessed; a model missing from this
# table is excluded from the cost total and flagged in the final
# summary (compute_pipeline_cost.py's unpriced_models), not silently
# costed as $0. Add a real rate here once sourced.
#
# claude_pricing is kept as an alias to this same table so anything
# still reading the old name (grepped repo-wide; nothing in this repo
# does as of this rename) doesn't silently break.
agent_pricing: &agent_pricing
  claude-opus-4-6:
    input_per_million: 5.00
    output_per_million: 25.00
    cache_write_per_million: 6.25
    cache_read_per_million: 0.50
  claude-haiku-4-5:
    input_per_million: 1.00
    output_per_million: 5.00
    cache_write_per_million: 1.25
    cache_read_per_million: 0.10
  # Gemini has no sourced cache-tier rate in this repo (implicit
  # caching, no cache_system-style explicit control -- see
  # dispatch_lens_gemini.yml's own comment) -- cache_write/cache_read
  # rates deliberately absent rather than guessed; compute_pipeline_cost.py
  # only prices cache tiers when both a rate AND a nonzero breakdown
  # exist, so omitting them here just falls back to the blended
  # input/output rate, never fabricates a cache price.
  gemini-3.5-flash:
    input_per_million: 1.50
    output_per_million: 9.00
  # gemini-3.6-flash and 3.7-flash are on PROMOTIONAL pricing through
  # 2026-12-31 ($0.75/$3.75); both double to $1.50/$7.50 on 2027-01-01.
  # Recorded at the promotional rate because agent_pricing drives what a
  # run actually costs today, and under-reporting real spend is the worse
  # error. Two consequences to remember:
  #
  #  - These entries MUST be updated on 2027-01-01 or every cost figure
  #    silently halves against reality.
  #  - A Model Benchmark Index entry citing these should record the
  #    STANDARD rate, not the promotional one -- a value ranking built on
  #    a promo price starts lying the day it expires.
  #
  # Note both are currently cheaper than gemini-3.5-flash above, on both
  # axes: newer and less expensive, not the usual trade.
  gemini-3.6-flash:
    input_per_million: 0.75
    output_per_million: 3.75
  gemini-3.7-flash:
    input_per_million: 0.75
    output_per_million: 3.75

claude_pricing: *agent_pricing

# git's real empty-tree object hash (verify with `git hash-object -t
# tree /dev/null`), used as review_target_ref to diff an entire
# checkout against nothing (a whole-branch audit, or a root commit
# with no parent). A single named default so resolve_target_branch.yml
# and resolve_target_commit.yml can't drift out of sync with each
# other.
git_empty_tree_sha: "4b825dc642cb6eb9a060e54bf8d69288fbee4904"
