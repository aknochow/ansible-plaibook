---
# Shared summary writer (all review_types use same always: block).
# Extracted to consolidate duplicated tail logic; last_run.json is shared path (race-safe for human use only).
# Use run-scoped last_run.<run_id>.json for programmatic consumption.

- name: Record the review completion time and elapsed duration
  ansible.builtin.set_fact:
    review_finished_at: "{{ now(utc=true).isoformat() }}"
    review_duration_seconds: >-
      {{ [
           0,
           (lookup('pipe', 'date +%s') | int)
           - (review_started_epoch | default(lookup('pipe', 'date +%s'), true) | int)
         ] | max }}

- name: Show the final pipeline stats breakdown
  when: pipeline_findings_reports is defined
  ansible.builtin.include_tasks: pipeline_stats.yml

# Generate run_id once (password lookup returns fresh value each call).
# Skip when the caller already supplied last_run_id (the plaibook/plai CLI
# does this so it can read last_run.<run_id>.json without scraping stdout).
# Extra-vars still win if this task ran; the when: just avoids a wasted lookup.
- name: Generate a unique run ID for this playbook invocation
  when: last_run_id is not defined or (last_run_id | string | length) == 0
  ansible.builtin.set_fact:
    last_run_id: "{{ lookup('password', '/dev/null length=16 chars=ascii_letters,digits') }}"

# One "skipping" notice for the whole group instead of five, if a
# failure happened early enough that pipeline_findings_reports was
# never initialized -- see write_last_run_files.yml's own header
# comment for why this is include_tasks + when, not block + when.
- name: Write the last-run summary (fixed and run-scoped copies)
  when: pipeline_findings_reports is defined
  ansible.builtin.include_tasks: write_last_run_files.yml
