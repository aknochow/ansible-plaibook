---
# Loaded only when review_cursor_sidecar_wanted. Keep this off review.yml:
# Ansible resolves play-level FQCNs at parse time, so a Vertex/Gemini AAP
# EE without aknochow.cursor fails before when: can skip the sidecar.
- name: Start a playbook-owned cursor-sdk-bridge sidecar
  environment: "{{ review_cursor_process_environment | default({}) }}"
  aknochow.cursor.bridge:
    state: present
    rundir: "{{ review_cursor_bridge_rundir }}"
    timeout: "{{ review_cursor_bridge_timeout }}"
  register: _cursor_sidecar

- name: Record sidecar attach file paths without loading the token
  when: _cursor_sidecar is succeeded
  ansible.builtin.set_fact:
    review_cursor_sidecar_started: true
    review_cursor_bridge_url_file: "{{ _cursor_sidecar.url_file }}"
    review_cursor_bridge_token_file: "{{ _cursor_sidecar.token_file }}"
