---
# Extracted so aknochow.openshell.sandbox only loaded when actually needed.
# Unsandboxed-only EE doesn't need aknochow.openshell installed.

- name: Create the sandbox
  aknochow.openshell.sandbox:
    gateway: "{{ sandbox_gateway }}"
    tls_cert: "{{ sandbox_tls_cert | default(omit, true) }}"
    tls_key: "{{ sandbox_tls_key | default(omit, true) }}"
    tls_ca: "{{ sandbox_tls_ca | default(omit, true) }}"
    bearer_token: "{{ sandbox_bearer_token | default(omit, true) }}"
    workspace: "{{ sandbox_workspace | default(lookup('ansible.builtin.env', 'OPENSHELL_WORKSPACE'), true) | default('default', true) }}"
    image: "{{ sandbox_image }}"
    # Both optional, default to module defaults (no policy override; 300s wait).
    policy: "{{ sandbox_policy | default({}) }}"
    wait_timeout: "{{ sandbox_wait_timeout | default(300) }}"
    state: present
  register: sandbox

# Compute sandbox path once and reuse (avoids typos breaking the chain).
# sandbox.sandbox.name is server-generated by gateway.
# arbitrary user input, but stripping anything other than
# alphanumerics/dash/underscore costs nothing and rules out a
# path-escaping name entirely, from any source.
- name: Compute the sandbox bearer token file path
  when: sandbox_bearer_token | default('') | trim | length > 0
  ansible.builtin.set_fact:
    sandbox_bearer_token_file: "/tmp/ansible-plaibook-sandbox-bearer-token-{{ sandbox.sandbox.name | regex_replace('[^A-Za-z0-9_-]', '_') }}"

# Written to a file, not passed as a CLI arg or an `env VAR=value`
# wrapper, so it never appears in any process's argv at all — not even
# briefly. A CLI arg is visible via /proc/*/cmdline for the process's
# whole lifetime; `env VAR=value cmd` (needed since OpenSSH always runs
# ProxyCommand as `exec <command>`, and shell VAR=value
# assignment-prefix parsing doesn't apply to exec) narrows that to a
# sub-millisecond window during env's own execve() call, but doesn't
# eliminate it. Requires ssh_proxy.py's --bearer-token-file support
# (aknochow.openshell >= the version with that flag).
- name: Write the sandbox bearer token to a file
  when: sandbox_bearer_token_file is defined
  ansible.builtin.copy:
    content: "{{ sandbox_bearer_token }}"
    dest: "{{ sandbox_bearer_token_file }}"
    mode: "0600"
  no_log: true

- name: "Register the sandbox as an Ansible host over SSH ({{ sandbox.sandbox.name }})"
  ansible.builtin.add_host:
    name: sandbox_target
    ansible_host: "{{ sandbox.sandbox.name }}"
    ansible_user: sandbox
    ansible_connection: ssh
    # Without this, delegate_to tasks inherit the CONTROLLER's own
    # ansible_python_interpreter (play set_fact / host_vars / extra-vars)
    # instead of discovering the sandbox's own interpreter. extra-vars
    # would still win over this host var, so plai must not pass
    # ansible_python_interpreter on the command line.
    ansible_python_interpreter: auto_silent
    # quote (shlex-style single-quoting) on every interpolated value —
    # this whole string is inside the outer double quotes Ansible/shlex
    # parses (so embedded single quotes pass through as literal chars,
    # not real quoting, at that layer), but SSH later re-invokes
    # ProxyCommand via a real shell, which DOES interpret them as
    # quoting — confirmed live earlier with the --workspace value
    # (needed real quoting to survive being empty). Without quoting,
    # any of these values containing shell metacharacters would be
    # interpreted by that shell.
    ansible_ssh_common_args: >-
      -o ProxyCommand="{{ ssh_proxy_python | quote }} {{ ssh_proxy_script | quote }}
      --gateway {{ sandbox_gateway | quote }}
      {{ ('--tls-cert ' + (sandbox_tls_cert | quote) + ' --tls-key ' + (sandbox_tls_key | quote)
      + ' --tls-ca ' + (sandbox_tls_ca | quote)) if (sandbox_tls_cert | default('') | trim | length > 0) else '' }}
      {{ ('--bearer-token-file ' + (sandbox_bearer_token_file | quote)) if (sandbox_bearer_token_file is defined) else '' }}
      --sandbox {{ sandbox.sandbox.name | quote }} --workspace {{ sandbox.sandbox.workspace | quote }}"
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
      -o GlobalKnownHostsFile=/dev/null -o LogLevel=ERROR

# add_host auto_silent is an inventory host var. localhost's set_fact of
# ansible_python_interpreter is the same precedence as a fact, which
# would otherwise leak into delegate_to: sandbox_target. Pin auto_silent
# as a host fact on the guest so discovery stays on the sandbox. set_fact
# is an action plugin (no SSH); delegate_facts writes it onto sandbox_target.
- name: Keep sandbox interpreter discovery on the guest
  ansible.builtin.set_fact:
    ansible_python_interpreter: auto_silent
  delegate_to: sandbox_target
  delegate_facts: true
