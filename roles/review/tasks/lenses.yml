---
# Parallel dispatch of Security and Review agents, each with shared briefing + lens-specific steering.

- name: Domains this port has steering blocks for
  ansible.builtin.set_fact:
    known_steering_domains:
      - ci-pipeline
      - python-packaging
      - cli-entrypoint
      - subprocess
      - k8s-operator
      - openshift
      - new-repo
      - python-code
      - go-project
      - shell-bash
      - ansible
      - container
      - patternfly-ui
      - api-endpoints
      - database
      - performance

- name: Intersect detected domains with known steering blocks
  ansible.builtin.set_fact:
    matched_steering_domains: "{{ briefing_domains | intersect(known_steering_domains) }}"

# Reset domain steering accumulators since facts persist across include_role iterations.
# Facts accumulate across loops if not reset, causing cross-target pollution.
- name: Reset domain steering accumulators for this iteration
  ansible.builtin.set_fact:
    domain_steering_raw: []
    domain_steering_parsed: []

- name: Load each matched domain's steering content
  ansible.builtin.set_fact:
    domain_steering_raw: >-
      {{ domain_steering_raw +
         [{'domain': item, 'content': lookup('file', role_path + '/templates/domain_steering/' + item + '.md.j2')}] }}
  loop: "{{ matched_steering_domains }}"
  loop_control:
    label: "{{ item }}"

# YAML block scalars don't process \n escapes; splitlines() sidesteps this.
# Use plain double-quoted scalar for real newline where YAML interprets \n correctly.
- name: Compute a real newline character (YAML block scalars don't interpret \n escapes)
  ansible.builtin.set_fact:
    real_nl: "\n"

- name: Split the target annotation from the steering prose
  ansible.builtin.set_fact:
    domain_steering_parsed: >-
      {{ domain_steering_parsed +
         [{'domain': item.domain,
           'target': item.content.splitlines()[0],
           'prose': (item.content.splitlines()[1:] | join(real_nl)) | trim}] }}
  loop: "{{ domain_steering_raw }}"
  loop_control:
    label: "{{ item.domain }}"

# Guard against regression: every matched domain must produce non-empty guidance.
- name: Verify every matched domain actually produced steering guidance
  ansible.builtin.assert:
    that:
      - domain_steering_parsed | rejectattr('prose', 'equalto', '') | list | length == domain_steering_parsed | length
    fail_msg: >-
      Domain steering is broken: {{ matched_steering_domains | length }}
      domain(s) matched ({{ matched_steering_domains | join(', ') }}) but
      at least one produced empty prose. The split/join logic extracting
      each domain_steering/*.md.j2 template's guidance has regressed.
    success_msg: >-
      Domain steering verified: {{ domain_steering_parsed | length }}
      domain(s) matched, all with non-empty guidance text.
  when: matched_steering_domains | length > 0

- name: Select steering blocks for each agent
  ansible.builtin.set_fact:
    security_domain_blocks: >-
      {{ domain_steering_parsed | default([]) | selectattr('target', 'search', 'both agents|Security')
         | map(attribute='prose') | list }}
    review_domain_blocks: >-
      {{ domain_steering_parsed | default([]) | selectattr('target', 'search', 'both agents|Review Agent')
         | map(attribute='prose') | list }}

- name: Render the Security agent system prompt
  ansible.builtin.set_fact:
    security_system_prompt: "{{ lookup('template', role_path + '/templates/security_agent_prompt.j2') }}"
  vars:
    domain_steering_blocks: "{{ security_domain_blocks }}"
    full_diff: "{{ review_full_diff }}"
    prior_review_md: "{{ review_prior_review_md }}"

- name: Dump the Security agent's rendered prompt (debug mode only)
  when: review_debug_dump_prompts | bool
  ansible.builtin.include_tasks: dump_debug_prompt.yml
  vars:
    dump_prompt_name: "security_lens"
    dump_prompt_content: "{{ security_system_prompt }}"

- name: Render the Review agent system prompt
  ansible.builtin.set_fact:
    review_system_prompt: "{{ lookup('template', role_path + '/templates/review_agent_prompt.j2') }}"
  vars:
    domain_steering_blocks: "{{ review_domain_blocks }}"
    full_diff: "{{ review_full_diff }}"
    prior_review_md: "{{ review_prior_review_md }}"

- name: Dump the Review agent's rendered prompt (debug mode only)
  when: review_debug_dump_prompts | bool
  ansible.builtin.include_tasks: dump_debug_prompt.yml
  vars:
    dump_prompt_name: "review_lens"
    dump_prompt_content: "{{ review_system_prompt }}"

# Dispatch both lenses via the provider-native module for agent_family
# (claude | gemini | qwen; qwen not implemented yet). Mirrors
# tasks/main.yml's own "include_tasks: resolve_target_{{ review_type }}.yml"
# idiom one level up. Each dispatch_lens_*.yml is a hand-written,
# provider-native task file (never a shared abstraction class, see
# AGENTS.md) that ends by setting security_result/review_result in the
# SAME normalized shape: .structured.{findings,scores}, .resolved_model,
# .usage_normalized.
- name: "Dispatch lenses via provider-native module (agent_family={{ agent_family }})"
  ansible.builtin.include_tasks: "dispatch_lens_{{ agent_family }}.yml"

# Retry-on-malformed structured output only applies to Claude's forced
# tool-call path (a probabilistic model-generation quirk). Gemini's
# response_schema makes malformed structured output structurally
# impossible -- dispatch_lens_gemini.yml already asserts .structured is
# present and set the normalized fields directly, so there is nothing
# to validate/retry for agent_family != claude.
- name: Mark non-Claude lens dispatch valid directly (already schema-validated)
  when: agent_family != 'claude'
  ansible.builtin.set_fact:
    security_lens_valid: true
    review_lens_valid: true

# Reset per-lens validity flags; facts persist across review_targets loop iterations.
- name: Reset per-lens validity flags for this iteration
  when: agent_family == 'claude'
  ansible.builtin.set_fact:
    security_lens_valid: false
    review_lens_valid: false

# Preserves concurrent dispatch for common (no-malformation) case.
# Sequential retries only on malformed first attempt.
# See validate_lens_dispatch.yml for "valid" criteria; retry_lens_dispatch.yml for retry logic.
- name: Validate the Security lens's first-attempt structured output
  when: agent_family == 'claude'
  ansible.builtin.include_tasks: validate_lens_dispatch.yml
  vars:
    lens_label: "Security"
    lens_raw_result: "{{ security_result }}"
    lens_result_var: "security_result"
    lens_valid_var: "security_lens_valid"

- name: Validate the Review lens's first-attempt structured output
  when: agent_family == 'claude'
  ansible.builtin.include_tasks: validate_lens_dispatch.yml
  vars:
    lens_label: "Review"
    lens_raw_result: "{{ review_result }}"
    lens_result_var: "review_result"
    lens_valid_var: "review_lens_valid"

# Both retry loops run before any fail assert (gives each lens full retry budget).
# Prevents one lens's failure from aborting the other's retry sequence.
- name: Retry the Security lens's dispatch if its structured output was invalid
  ansible.builtin.include_tasks: retry_lens_dispatch.yml
  loop: "{{ range(2, review_structured_output_max_attempts | int + 1) | list }}"
  loop_control:
    loop_var: lens_attempt_number
  vars:
    lens_label: "Security"
    lens_result_var: "security_result"
    lens_valid_var: "security_lens_valid"
    lens_system_prompt: "{{ security_system_prompt }}"
    lens_schema: "{{ security_findings_schema }}"
  when: agent_family == 'claude' and not security_lens_valid

- name: Retry the Review lens's dispatch if its structured output was invalid
  ansible.builtin.include_tasks: retry_lens_dispatch.yml
  loop: "{{ range(2, review_structured_output_max_attempts | int + 1) | list }}"
  loop_control:
    loop_var: lens_attempt_number
  vars:
    lens_label: "Review"
    lens_result_var: "review_result"
    lens_valid_var: "review_lens_valid"
    lens_system_prompt: "{{ review_system_prompt }}"
    lens_schema: "{{ review_findings_schema }}"
  when: agent_family == 'claude' and not review_lens_valid

- name: Fail loudly if the Security lens never produced valid structured output
  ansible.builtin.assert:
    that:
      - security_lens_valid
    fail_msg: >-
      Security lens ({{ review_agent_model }}, agent_family={{ agent_family }}) failed to
      produce valid structured output after {{ review_structured_output_max_attempts }}
      attempt(s). Consider raising review_structured_output_max_attempts or checking model
      reliability.

- name: Fail loudly if the Review lens never produced valid structured output
  ansible.builtin.assert:
    that:
      - review_lens_valid
    fail_msg: >-
      Review lens ({{ review_agent_model }}, agent_family={{ agent_family }}) failed to
      produce valid structured output after {{ review_structured_output_max_attempts }}
      attempt(s). Consider raising review_structured_output_max_attempts or checking model
      reliability.

# Surface resolved model (otherwise only in merged findings.md).
# resolved_model is each dispatch_lens_*.yml's normalized echo of the
# actually-served model; may differ from the requested alias.
- name: Show which provider/model served the Security agent
  ansible.builtin.debug:
    msg: >-
      agent_family={{ agent_family }}
      resolved_model={{ security_result.resolved_model }}

- name: Show the Security agent's raw findings
  ansible.builtin.debug:
    msg: "{{ (security_result.structured | to_nice_json(indent=2)).split('\n') }}"

- name: Show the Security agent's normalized token usage
  ansible.builtin.debug:
    var: security_result.usage_normalized

- name: Show which provider/model served the Review agent
  ansible.builtin.debug:
    msg: >-
      agent_family={{ agent_family }}
      resolved_model={{ review_result.resolved_model }}

- name: Show the Review agent's raw findings
  ansible.builtin.debug:
    msg: "{{ (review_result.structured | to_nice_json(indent=2)).split('\n') }}"

- name: Show the Review agent's normalized token usage
  ansible.builtin.debug:
    var: review_result.usage_normalized

# pipeline_agent_calls: NOT reset (accumulates across review_targets loop for pipeline-wide summary).
# 'usage' here is always the NORMALIZED shape (input_tokens/output_tokens/
# cache_write_tokens/cache_read_tokens/total_tokens) regardless of
# agent_family -- compute_pipeline_cost.py reads exactly these key names
# from every entry, never a provider-specific raw usage dict.
- name: Record this iteration's agent calls for the pipeline-wide stats summary
  ansible.builtin.set_fact:
    pipeline_agent_calls: >-
      {{ pipeline_agent_calls + [
           {'target': review_org_repo + '#' + review_number, 'lens': 'security',
            'model': security_result.resolved_model, 'usage': security_result.usage_normalized},
           {'target': review_org_repo + '#' + review_number, 'lens': 'review',
            'model': review_result.resolved_model, 'usage': review_result.usage_normalized},
         ] }}

# Make pricing table available for pipeline-wide summary (survives role scope).
# agent_pricing (renamed from claude_pricing) now carries both providers'
# rates keyed by model, so this one assignment works for any agent_family.
- name: Make the pricing table available to the pipeline-wide summary
  ansible.builtin.set_fact:
    pipeline_pricing_table: "{{ agent_pricing }}"
