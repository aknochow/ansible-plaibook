---
# kubernetes.core.k8s_info extracted for conditional loading (module validation at parse time).
# Unsandboxed EE doesn't need kubernetes.core unless sandbox_tls_source: k8s_secret is used.

- name: Read the client TLS secret (one call — all three fields land here)
  kubernetes.core.k8s_info:
    # Omit kubeconfig for auto-detect (in-cluster AAP pod). sandbox_kubeconfig for local testing.
    kubeconfig: "{{ sandbox_kubeconfig | default(omit, true) }}"
    kind: Secret
    name: "{{ sandbox_secret_name }}"
    namespace: "{{ sandbox_secret_namespace }}"
  register: tls_secret

- name: Write decoded cert material to temp files
  ansible.builtin.copy:
    content: "{{ tls_secret.resources[0].data[item.key] | b64decode }}"
    dest: "{{ sandbox_tls_dir_path }}/{{ item.file }}"
    mode: "0600"
  loop:
    - { key: "ca.crt", file: "ca.crt" }
    - { key: "tls.crt", file: "tls.crt" }
    - { key: "tls.key", file: "tls.key" }
  loop_control:
    label: "{{ item.file }}"

- name: Set fact paths for the fetched certs
  ansible.builtin.set_fact:
    sandbox_tls_cert: "{{ sandbox_tls_dir_path }}/tls.crt"
    sandbox_tls_key: "{{ sandbox_tls_dir_path }}/tls.key"
    sandbox_tls_ca: "{{ sandbox_tls_dir_path }}/ca.crt"
