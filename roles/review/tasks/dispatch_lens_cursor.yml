---
# Cursor lens dispatch (agent_family: cursor). Uses aknochow.cursor.agent
# (cursor-sdk local Agent.create + send + parent event drain + wait),
# not Agent.prompt (that drops the stream used to classify who invoked
# the custom tool) and not an OpenAI-compatible chat client.
#
# When review.yml started a playbook-owned sidecar, this task inherits
# CURSOR_SDK_BRIDGE_URL_FILE / CURSOR_SDK_BRIDGE_TOKEN_FILE (paths only)
# and attaches instead of nested launch_bridge.
#
# Module contract:
# - No parent system_prompt. Trusted lens text + untrusted diff live in
#   agents.*.prompt on one named subagent. Do not move the diff onto the
#   parent user prompt. Do not implement a one-agent collapse (shape A
#   is parked).
# - No generation-time output_format: json_schema. structured_tool
#   (report_findings) uses the shared findings schema (prompt_nonce
#   required). Do not require a model-computed digest. Do not revive HMAC.
# - Consume structured_tool_calls with caller=nested (the named *_lens
#   execute). Ignore parent executes. A missing nested execute is an
#   invalid attempt, retried with review_structured_output_max_attempts
#   (same budget explore/verify already use). Parent last-call is not
#   the bind. After the budget, fail closed on trust.
# - Each lens is dispatched, consumed, and retried independently so a
#   Review miss does not throw away a bound Security sibling or its
#   usage. Do not fail closed on I/O mid-budget: module errors retry.
# - prompt_nonce in agents.*.prompt is a cheap spawn canary. Matching it
#   after a nested execute is extra; the nested execute is the payload
#   bind. tools: [mcp] GetDynamicTools fabrication is a parent execute
#   with no nested execute and never counts as a review.
# - Do not print .text in fail_msg (lens drafts can quote secrets).
# - cwd is review_repo_path; setting_sources is [] so the repo under
#   review does not leak CLAUDE.md / Cursor rules into the session.
# - tools: [mcp, task] -- mcp is required for structured_tool
#   (tools=[] hides custom tools). task is required to spawn named
#   agents (SDK docs: disallowing task prevents subagents). [mcp]
#   alone hides task / Subagent; luna then fabricates via
#   GetDynamicTools as a parent execute. Do not "fix" this back to [mcp].
# - Parent prompt must name the Task / Subagent tool and tell the
#   parent to spawn the named agent. Do not instruct the parent to call
#   report_findings itself. Do not say "Use the X agent" as if X were a
#   tool -- that is what sent luna into GetDynamicTools.
#
# Sets security_result/review_result in the SAME normalized shape
# dispatch_lens_claude_cli.yml produces: .structured.{findings,scores},
# .resolved_model, .usage_normalized. No observed_cost_usd -- cursor-sdk
# RunResult has no USD on the one-shot path. Per-attempt usage is
# appended to pipeline_agent_calls here (including failed attempts
# that are not parent-only). Parent last-call is not a lens call.

- name: "Cursor: show the Security agent's request configuration"
  ansible.builtin.debug:
    msg: "{{ [
      'model: ' + review_cursor_model,
      'effort: ' + review_cursor_effort,
      'cwd: ' + review_repo_path,
      'setting_sources: []',
      'tools: [mcp, task]',
      'structured_tool: report_findings (security_findings_schema)',
      '',
      '--- subagent prompt ---',
      ] + security_system_prompt.split('\n') }}"

- name: "Cursor: reset Security named-lens validity for this iteration"
  ansible.builtin.set_fact:
    security_cursor_lens_valid: false
    review_cursor_lens_valid: false
    security_cursor_lens_hold: false
    review_cursor_lens_hold: false

- name: "Cursor: start the Security agent"
  action: "{{ cursor_agent_module | default('aknochow.cursor.agent') }}"
  args:
    api_key: "{{ review_cursor_api_key }}"
    prompt: >-
      Spawn the security_lens subagent with the Task / Subagent tool.
      You must call the Task / Subagent tool -- security_lens is not
      itself a tool. Wait for security_lens to finish.
    model: "{{ review_cursor_model }}"
    effort: "{{ review_cursor_effort }}"
    cwd: "{{ review_repo_path }}"
    setting_sources: []
    tools: [mcp, task]
    agents: "{{ {'security_lens': {'description': 'Security review lens with trusted instructions.', 'prompt': security_system_prompt}} }}"
    structured_tool:
      name: report_findings
      description: Submit the security findings and scores for this diff.
      input_schema: "{{ security_findings_schema }}"
  async: "{{ review_cursor_lens_timeout | int }}"
  poll: 0
  register: _cursor_security_job

- name: "Cursor: start the Review agent"
  action: "{{ cursor_agent_module | default('aknochow.cursor.agent') }}"
  args:
    api_key: "{{ review_cursor_api_key }}"
    prompt: >-
      Spawn the review_lens subagent with the Task / Subagent tool.
      You must call the Task / Subagent tool -- review_lens is not
      itself a tool. Wait for review_lens to finish.
    model: "{{ review_cursor_model }}"
    effort: "{{ review_cursor_effort }}"
    cwd: "{{ review_repo_path }}"
    setting_sources: []
    tools: [mcp, task]
    agents: "{{ {'review_lens': {'description': 'Functionality and quality review lens with trusted instructions.', 'prompt': review_system_prompt}} }}"
    structured_tool:
      name: report_findings
      description: Submit the review findings and scores for this diff.
      input_schema: "{{ review_findings_schema }}"
  async: "{{ review_cursor_lens_timeout | int }}"
  poll: 0
  register: _cursor_review_job

# A failed async job is still a result. One looped wait used to fail the
# whole task with "One or more items failed" and the pipeline rescue
# dropped the sibling before bind. failed_when: false stopped that abort
# by clearing each item's failed flag (ansible-core stores the conditional
# result there). A start error then has finished=true, failed=false, and
# no status, usage_normalized, or structured_tool_calls, so bind treated
# "database is locked" as a finished lens and fail-closed.
#
# Wait for each job on its own. ignore_errors keeps the module's failed
# flag and does not enter the pipeline rescue. The attempt task
# redispatches only when that flag is still true. Do not put
# failed_when: false back on these tasks.
- name: "Cursor: wait for the Security agent"
  ansible.builtin.async_status:
    jid: "{{ _cursor_security_job.ansible_job_id }}"
  register: _cursor_security_wait
  until: >-
    (_cursor_security_wait.finished | default(false) | bool) or
    (_cursor_security_wait.failed | default(false) | bool)
  retries: "{{ (review_cursor_lens_timeout | int / review_cursor_lens_poll_delay | int) | round(0, 'ceil') | int }}"
  delay: "{{ review_cursor_lens_poll_delay | int }}"
  ignore_errors: true

- name: "Cursor: wait for the Review agent"
  ansible.builtin.async_status:
    jid: "{{ _cursor_review_job.ansible_job_id }}"
  register: _cursor_review_wait
  until: >-
    (_cursor_review_wait.finished | default(false) | bool) or
    (_cursor_review_wait.failed | default(false) | bool)
  retries: "{{ (review_cursor_lens_timeout | int / review_cursor_lens_poll_delay | int) | round(0, 'ceil') | int }}"
  delay: "{{ review_cursor_lens_poll_delay | int }}"
  ignore_errors: true

- name: "Cursor: bind the Security agent result"
  ansible.builtin.include_tasks: dispatch_cursor_lens_attempt.yml
  vars:
    cursor_lens_attempt_number: 1
    cursor_lens_preregistered_raw: "{{ _cursor_security_wait }}"
    cursor_lens_agent_id: security_lens
    cursor_lens_description: Security review lens with trusted instructions.
    cursor_lens_prompt: "{{ security_system_prompt }}"
    cursor_lens_schema: "{{ security_findings_schema }}"
    cursor_lens_tool_description: Submit the security findings and scores for this diff.
    cursor_nonce_lens_label: "Security lens"
    cursor_lens_valid_var: security_cursor_lens_valid
    cursor_lens_args_var: _cursor_security_lens
    cursor_lens_fail_var: security_cursor_lens_last_fail
    cursor_lens_raw_var: _cursor_security_raw
    cursor_lens_stats_name: security
    cursor_lens_hold_var: security_cursor_lens_hold

- name: "Cursor: retry the Security agent if the named lens did not bind"
  ansible.builtin.include_tasks: dispatch_cursor_lens_attempt.yml
  loop: "{{ range(2, review_structured_output_max_attempts | int + 1) | list }}"
  loop_control:
    loop_var: cursor_lens_attempt_number
  vars:
    cursor_lens_agent_id: security_lens
    cursor_lens_description: Security review lens with trusted instructions.
    cursor_lens_prompt: "{{ security_system_prompt }}"
    cursor_lens_schema: "{{ security_findings_schema }}"
    cursor_lens_tool_description: Submit the security findings and scores for this diff.
    cursor_nonce_lens_label: "Security lens"
    cursor_lens_valid_var: security_cursor_lens_valid
    cursor_lens_args_var: _cursor_security_lens
    cursor_lens_fail_var: security_cursor_lens_last_fail
    cursor_lens_raw_var: _cursor_security_raw
    cursor_lens_stats_name: security
    cursor_lens_hold_var: security_cursor_lens_hold
  when:
    - not (security_cursor_lens_valid | bool)
    - not (security_cursor_lens_hold | default(false) | bool)

- name: "Cursor: show the Review agent's request configuration"
  ansible.builtin.debug:
    msg: "{{ [
      'model: ' + review_cursor_model,
      'effort: ' + review_cursor_effort,
      'cwd: ' + review_repo_path,
      'setting_sources: []',
      'tools: [mcp, task]',
      'structured_tool: report_findings (review_findings_schema)',
      '',
      '--- subagent prompt ---',
      ] + review_system_prompt.split('\n') }}"

- name: "Cursor: bind the Review agent result"
  ansible.builtin.include_tasks: dispatch_cursor_lens_attempt.yml
  vars:
    cursor_lens_attempt_number: 1
    cursor_lens_preregistered_raw: "{{ _cursor_review_wait }}"
    cursor_lens_agent_id: review_lens
    cursor_lens_description: Functionality and quality review lens with trusted instructions.
    cursor_lens_prompt: "{{ review_system_prompt }}"
    cursor_lens_schema: "{{ review_findings_schema }}"
    cursor_lens_tool_description: Submit the review findings and scores for this diff.
    cursor_nonce_lens_label: "Review lens"
    cursor_lens_valid_var: review_cursor_lens_valid
    cursor_lens_args_var: _cursor_review_lens
    cursor_lens_fail_var: review_cursor_lens_last_fail
    cursor_lens_raw_var: _cursor_review_raw
    cursor_lens_stats_name: review
    cursor_lens_hold_var: review_cursor_lens_hold

- name: "Cursor: retry the Review agent if the named lens did not bind"
  ansible.builtin.include_tasks: dispatch_cursor_lens_attempt.yml
  loop: "{{ range(2, review_structured_output_max_attempts | int + 1) | list }}"
  loop_control:
    loop_var: cursor_lens_attempt_number
  vars:
    cursor_lens_agent_id: review_lens
    cursor_lens_description: Functionality and quality review lens with trusted instructions.
    cursor_lens_prompt: "{{ review_system_prompt }}"
    cursor_lens_schema: "{{ review_findings_schema }}"
    cursor_lens_tool_description: Submit the review findings and scores for this diff.
    cursor_nonce_lens_label: "Review lens"
    cursor_lens_valid_var: review_cursor_lens_valid
    cursor_lens_args_var: _cursor_review_lens
    cursor_lens_fail_var: review_cursor_lens_last_fail
    cursor_lens_raw_var: _cursor_review_raw
    cursor_lens_stats_name: review
    cursor_lens_hold_var: review_cursor_lens_hold
  when:
    - not (review_cursor_lens_valid | bool)
    - not (review_cursor_lens_hold | default(false) | bool)

# Build whichever sibling bound before the trust checkpoint so a Review
# miss does not throw Security findings or usage away.
- name: "Cursor: build the normalized Security result"
  when: security_cursor_lens_valid | bool
  ansible.builtin.set_fact:
    security_result:
      structured:
        findings: "{{ _cursor_security_lens.findings | default([]) }}"
        scores: "{{ _cursor_security_lens.scores | default({}) }}"
      resolved_model: "{{ _cursor_security_raw.resolved_model | default(review_cursor_model) }}"
      usage_normalized: "{{ _cursor_security_raw.usage_normalized }}"

- name: "Cursor: build the normalized Review result"
  when: review_cursor_lens_valid | bool
  ansible.builtin.set_fact:
    review_result:
      structured:
        findings: "{{ _cursor_review_lens.findings | default([]) }}"
        scores: "{{ _cursor_review_lens.scores | default({}) }}"
      resolved_model: "{{ _cursor_review_raw.resolved_model | default(review_cursor_model) }}"
      usage_normalized: "{{ _cursor_review_raw.usage_normalized }}"

- name: "Cursor: fail closed if the Security named lens never bound"
  ansible.builtin.assert:
    that:
      - security_cursor_lens_valid | bool
    fail_msg: >-
      Security lens (agent_family=cursor) did not bind a nested
      report_findings execute after {{ review_structured_output_max_attempts }}
      attempt(s). {{ security_cursor_lens_last_fail | default('The named *_lens subagent did not submit findings. Do not use parent last-call.') }}
      The model's draft is NOT printed here.

- name: "Cursor: fail closed if the Review named lens never bound"
  ansible.builtin.assert:
    that:
      - review_cursor_lens_valid | bool
    fail_msg: >-
      Review lens (agent_family=cursor) did not bind a nested
      report_findings execute after {{ review_structured_output_max_attempts }}
      attempt(s). {{ review_cursor_lens_last_fail | default('The named *_lens subagent did not submit findings. Do not use parent last-call.') }}
      The model's draft is NOT printed here.
