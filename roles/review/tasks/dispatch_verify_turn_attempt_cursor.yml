---
# One dispatch attempt for current verify turn, cursor side.
#
# Same idea as dispatch_verify_turn_attempt_claude_cli.yml: one module
# call runs explore-then-verdict internally. Cursor cannot take
# plaibook's custom read_file/search/trace_reachability schemas (no
# parent system_prompt, no generation-time json_schema, custom tools
# only via structured_tool / mcp). Built-in read + report_verdict
# structured_tool stand in. Cursor uses the shared
# verify_verdict_schema (prompt_nonce required). Do not require a
# model-computed digest. Do not revive HMAC. Do not use a Cursor-only
# schema copy. Reachability is the model's own read of control flow,
# not trace_reachability.py -- same gap as claude_cli.
#
# Synthesize at most one report_verdict tool_use so verify_turn.yml's
# "dispatch any other tool calls" step sees an empty other-tools list
# and flips review_verify_done on the first outer turn when a verdict
# lands.
#
# tools: [mcp, task] -- same parent allowlist as the working
# security/review lenses. Do not offer read on the parent: luna then
# verifies itself and fabricates report_verdict without Task.
# AgentDefinition has no tools field; the spawned subagent uses the
# default filesystem tools. Do not revert to [read, mcp, task] or [mcp]
# alone.
#
# Agent name is verify_lens, not verify -- same collision as the
# explore parent named explore. Do not rename this back to verify.
#
# Parent prompt must name the Task / Subagent tool and tell the parent
# to spawn the named agent. Do not instruct the parent to call
# report_verdict itself. Consume structured_tool_calls with
# caller=nested. Ignore parent executes. Fail closed when the named
# lens never called the tool on the last verify turn; mid-turns with
# zero executes retry. Parent-only execute (GetDynamicTools /
# tools: [mcp] fabrication) always fails closed.
# A module fail_json (Cursor status=error with an empty body) is one
# failed attempt. Rescue only that module call and retry. A nested
# report_verdict on that failed return still binds, and its usage is
# recorded even when a parent execute is also present. Do not abort the
# playbook before persist. Nonce validation and named-lens selection
# stay outside the rescue: a mismatch or a parent-only fabrication
# fails the play, including on a non-final verify turn. Any other
# module failure (auth, config, transport) is re-raised. Do not turn
# it into end_turn.
#
# prompt_nonce is a cheap spawn canary after a nested execute. The
# nested execute is the payload bind. Do not print .text in fail_msg.

# include_tasks with a loop includes every item whose when was true
# when the loop started. A later item still runs after an earlier
# attempt has already bound a verdict, and would replace it. Skip
# the rest of this file once verify_dispatch_valid is true.
# cursor_agent_module exists so playbook tests can load cursor_agent_stub.
# It is an allowlist, not an open module name: extra-vars cannot point
# verify at ansible.builtin.command or any other plugin.
- name: Resolve the Cursor verify module name
  ansible.builtin.set_fact:
    _cursor_verify_module: "{{ cursor_agent_module | default('aknochow.cursor.agent') }}"
    # Captured once. The block below sets verify_dispatch_valid, and a
    # block when is re-checked per task, so the condition cannot be
    # verify_dispatch_valid itself.
    _cursor_verify_attempt_open: "{{ not (verify_dispatch_valid | default(false) | bool) }}"

- name: Run this Cursor verify attempt
  when: _cursor_verify_attempt_open | bool
  block:
  - name: Reject a Cursor verify module outside the allowlist
    ansible.builtin.assert:
      that:
        - _cursor_verify_module in ['aknochow.cursor.agent', 'cursor_agent_stub']
      fail_msg: >-
        cursor_agent_module '{{ _cursor_verify_module }}' is not allowed.
        Verify will only load aknochow.cursor.agent or the offline test stub.

  - name: "Cursor: show this verify turn's request configuration"
    ansible.builtin.debug:
      msg:
        - "model: {{ review_verify_cursor_model }}"
        - "effort: {{ review_cursor_effort }}"
        - "cwd: {{ review_repo_path }}"
        - "setting_sources: []"
        - "tools: [mcp, task]"
        - "structured_tool: report_verdict (verify_verdict_schema)"

  - name: Remember that this attempt's module call has not failed yet
    ansible.builtin.set_fact:
      _cursor_verify_module_failed: false

  - name: Cursor verify module call
    block:
      - name: "Cursor: dispatch the verify agent"
        action:
          module: "{{ _cursor_verify_module }}"
          api_key: "{{ review_cursor_api_key }}"
          prompt: >-
            Spawn the verify_lens subagent with the Task / Subagent tool.
            You must call the Task / Subagent tool -- verify_lens is not
            itself a tool. Do not refute the finding yourself. Do not call
            report_verdict yourself. Wait for verify_lens to finish.
          model: "{{ review_verify_cursor_model }}"
          effort: "{{ review_cursor_effort }}"
          cwd: "{{ review_repo_path }}"
          setting_sources: []
          tools: [mcp, task]
          agents:
            verify_lens:
              description: Adversarial single-finding verifier with trusted instructions.
              prompt: "{{ verify_system_prompt }}"
          structured_tool:
            name: report_verdict
            description: Submit the verification verdict for this one finding.
            input_schema: "{{ verify_verdict_schema }}"
        register: _cursor_verify_raw
    rescue:
      - name: "Cursor: keep the failed module return"
        ansible.builtin.set_fact:
          _cursor_verify_module_failed: true
          _cursor_verify_failed_result: "{{ ansible_failed_result }}"

  - name: Classify a failed Cursor verify module return
    when: _cursor_verify_module_failed | bool
    block:
      - name: "Cursor: classify the failed verify return"
        ansible.builtin.set_fact:
          _verify_failed_nested: >-
            {{ (_cursor_verify_failed_result.structured_tool_calls | default([]))
               | selectattr('caller', 'equalto', 'nested')
               | selectattr('name', 'equalto', 'report_verdict')
               | list }}
          _verify_failed_parent: >-
            {{ (_cursor_verify_failed_result.structured_tool_calls | default([]))
               | selectattr('caller', 'equalto', 'parent')
               | list }}
          _verify_failed_status_error: >-
            {{ (_cursor_verify_failed_result.status | default('')) == 'error'
               or ('status error' in (_cursor_verify_failed_result.msg | default('') | lower)) }}

      - name: "Cursor: re-raise a parent-only verify fabrication"
        when:
          - _verify_failed_parent | length > 0
          - _verify_failed_nested | length == 0
        ansible.builtin.fail:
          msg: "{{ _cursor_verify_failed_result.msg | default('Verify parent-only report_verdict') }}"

      - name: "Cursor: bind a nested verdict that arrived with status=error"
        when: _verify_failed_nested | length > 0
        ansible.builtin.set_fact:
          cursor_lens_structured: "{{ _verify_failed_nested[-1].args }}"
          cursor_named_lens_present: true
          verify_dispatch_provider_error: false
          verify_dispatch_valid: true
          verify_turn_result:
            message:
              content:
                - id: cursor_report_verdict
                  name: report_verdict
                  input: "{{ _verify_failed_nested[-1].args }}"
              model: "{{ _cursor_verify_failed_result.resolved_model | default(review_verify_cursor_model) }}"
            tool_calls:
              - id: cursor_report_verdict
                name: report_verdict
                input: "{{ _verify_failed_nested[-1].args }}"
            stop_reason: tool_use
            usage: "{{ _cursor_verify_failed_result.usage_normalized | default({}) }}"

      - name: "Cursor: fail closed if the rescued Verify nonce mismatches"
        when: _verify_failed_nested | length > 0
        ansible.builtin.include_tasks: assert_cursor_prompt_nonce.yml
        vars:
          cursor_nonce_structured: "{{ cursor_lens_structured }}"
          cursor_nonce_lens_label: "Verify"

      # Parent-only is not a lens call. A nested report_verdict is,
      # even when that same return also has a parent execute.
      - name: "Cursor: record usage from a failed verify return"
        when:
          - _cursor_verify_failed_result.usage_normalized is defined
          - (_verify_failed_nested | length > 0) or (_verify_failed_parent | length == 0)
        ansible.builtin.set_fact:
          pipeline_agent_calls: >-
            {{ (pipeline_agent_calls | default([])) + [{
                 'target': review_org_repo + '#' + review_number, 'lens': 'verify',
                 'model': _cursor_verify_failed_result.resolved_model | default(review_verify_cursor_model),
                 'usage': _cursor_verify_failed_result.usage_normalized,
                 'attempt': verify_attempt_number | default(1)
               }] }}

      - name: "Cursor: empty status=error is a failed attempt, not a dead review"
        when:
          - _verify_failed_nested | length == 0
          - _verify_failed_parent | length == 0
          - _verify_failed_status_error | bool
        ansible.builtin.set_fact:
          verify_dispatch_provider_error: true
          verify_dispatch_valid: false
          verify_turn_result:
            message:
              content: []
              model: "{{ _cursor_verify_failed_result.resolved_model | default(review_verify_cursor_model) }}"
            tool_calls: []
            stop_reason: error
            usage: "{{ _cursor_verify_failed_result.usage_normalized | default({}) }}"

      - name: "Cursor: re-raise a module failure that is not an empty status=error"
        when:
          - _verify_failed_nested | length == 0
          - _verify_failed_parent | length == 0
          - not (_verify_failed_status_error | bool)
        ansible.builtin.fail:
          msg: "{{ _cursor_verify_failed_result.msg | default('Cursor verify module failed') }}"

  - name: Record a successful Cursor verify return
    when: not (_cursor_verify_module_failed | bool)
    block:
      - name: "Cursor: record this attempt's usage for the pipeline-wide stats summary"
        ansible.builtin.set_fact:
          pipeline_agent_calls: >-
            {{ (pipeline_agent_calls | default([])) + [{
                 'target': review_org_repo + '#' + review_number, 'lens': 'verify',
                 'model': _cursor_verify_raw.resolved_model | default(review_verify_cursor_model),
                 'usage': _cursor_verify_raw.usage_normalized,
                 'attempt': verify_attempt_number | default(1)
               }] }}

      - name: "Cursor: consume Verify named-lens execute"
        ansible.builtin.include_tasks: select_cursor_named_lens.yml
        vars:
          cursor_raw: "{{ _cursor_verify_raw }}"
          cursor_nonce_lens_label: "Verify"
          cursor_lens_tool: report_verdict
          cursor_named_lens_required: "{{ verify_last_turn | default(false) }}"

      - name: "Cursor: fail closed if the Verify named lens nonce mismatches"
        when: cursor_named_lens_present | default(false) | bool
        ansible.builtin.include_tasks: assert_cursor_prompt_nonce.yml
        vars:
          cursor_nonce_structured: "{{ cursor_lens_structured }}"
          cursor_nonce_lens_label: "Verify"

      - name: "Cursor: build this attempt's synthesized report_verdict tool_use (if any)"
        ansible.builtin.set_fact:
          _cursor_verify_report_call: >-
            {{ [{'id': 'cursor_report_verdict',
                 'name': 'report_verdict',
                 'input': cursor_lens_structured}]
               if (cursor_named_lens_present | default(false) | bool) else [] }}

      - name: "Cursor: normalize this attempt's result into the shared verify_turn_result shape"
        ansible.builtin.set_fact:
          verify_turn_result:
            message:
              content: "{{ _cursor_verify_report_call }}"
              model: "{{ _cursor_verify_raw.resolved_model | default(review_verify_cursor_model) }}"
            tool_calls: "{{ _cursor_verify_report_call }}"
            stop_reason: "{{ 'tool_use' if (cursor_named_lens_present | default(false) | bool) else (_cursor_verify_raw.status | default('unknown')) }}"
            usage: "{{ _cursor_verify_raw.usage_normalized }}"

      - name: "Cursor: check whether this attempt produced a named-lens verdict"
        ansible.builtin.set_fact:
          _verify_cursor_structured_present: "{{ cursor_named_lens_present | default(false) | bool }}"

      - name: "Cursor: mark this attempt valid unless it's the forced last turn with no verdict at all"
        ansible.builtin.set_fact:
          verify_dispatch_provider_error: false
          verify_dispatch_valid: "{{ (not verify_last_turn) or (_verify_cursor_structured_present | bool) }}"
