---
# Parse review_target into platform/org_repo/number/hostname.
# Extracted for testability (avoids network calls in test_resolve_target_pr_parsing.yml).

- name: Parse the review target identifier
  ansible.builtin.set_fact:
    _gh_url_match: "{{ review_target | regex_search('^https?://github\\.com/([^/]+/[^/]+)/pull/(\\d+)', '\\1', '\\2') }}"
    _gt_url_match: "{{ review_target | regex_search('^https?://(?!github\\.com)([^/]+)/([^/]+/[^/]+)/pulls?/(\\d+)', '\\1', '\\2', '\\3') }}"
    _gl_url_match: "{{ review_target | regex_search('^https?://([^/]+)/(.+)/-/merge_requests/(\\d+)', '\\1', '\\2', '\\3') }}"
    _gh_bare_match: "{{ review_target | regex_search('^([A-Za-z0-9_.~-]+/[A-Za-z0-9_.~-]+)#(\\d+)$', '\\1', '\\2') }}"
    _gt_bare_host_match: "{{ review_target | regex_search('^gitea:([A-Za-z0-9._-]+):([^/]+/[^/]+)#(\\d+)$', '\\1', '\\2', '\\3') }}"
    _gt_bare_match: "{{ review_target | regex_search('^gitea:([^/]+/[^/]+)#(\\d+)$', '\\1', '\\2') }}"
    _gl_bare_match: "{{ review_target | regex_search('^([^/]+/[^/]+)!(\\d+)$', '\\1', '\\2') }}"
    # Self-hosted GitLab form: 'host:org/repo!N'. Separate regex (not optional group)
    # to avoid None handling in ternaries. Restrict hostname capture to valid charset.
    _gl_bare_host_match: "{{ review_target | regex_search('^([A-Za-z0-9._-]+):([^/]+/[^/]+)!(\\d+)$', '\\1', '\\2', '\\3') }}"

- name: Resolve platform, org/repo, number, hostname
  ansible.builtin.set_fact:
    review_platform: >-
      {{ 'github' if (_gh_url_match or _gh_bare_match)
         else 'gitea' if (_gt_url_match or _gt_bare_host_match or _gt_bare_match)
         else 'gitlab' }}
    review_org_repo: >-
      {{ (_gh_url_match[0] if _gh_url_match
          else _gh_bare_match[0] if _gh_bare_match
          else _gt_url_match[1] if _gt_url_match
          else _gt_bare_host_match[1] if _gt_bare_host_match
          else _gt_bare_match[0] if _gt_bare_match
          else _gl_url_match[1] if _gl_url_match
          else _gl_bare_host_match[1] if _gl_bare_host_match
          else _gl_bare_match[0] if _gl_bare_match
          else '') }}
    review_number: >-
      {{ (_gh_url_match[1] if _gh_url_match
          else _gh_bare_match[1] if _gh_bare_match
          else _gt_url_match[2] if _gt_url_match
          else _gt_bare_host_match[2] if _gt_bare_host_match
          else _gt_bare_match[1] if _gt_bare_match
          else _gl_url_match[2] if _gl_url_match
          else _gl_bare_host_match[2] if _gl_bare_host_match
          else _gl_bare_match[1] if _gl_bare_match
          else '') }}
    review_hostname: >-
      {{ _gt_url_match[0] if _gt_url_match
         else _gt_bare_host_match[0] if _gt_bare_host_match
         else _gl_url_match[0] if _gl_url_match
         else _gl_bare_host_match[0] if _gl_bare_host_match
         else '' }}

- name: Fail on unparseable review target
  ansible.builtin.fail:
    msg: >-
      Could not parse review_target '{{ review_target }}'. Expected a GitHub
      PR URL, Gitea PR URL, GitLab MR URL, 'org/repo#N' (GitHub), 'gitea:host:org/repo#N' (Gitea),
      'org/repo!N' (GitLab), or 'host:org/repo!N' (self-hosted GitLab).
  when: not review_org_repo or not review_number

# review_number is already digit-only by construction (every capturing
# regex above uses \d+ for it) -- asserted anyway since this is the
# actual trust boundary (review_target is caller-supplied), not
# defensive-paranoia deep in internal logic. review_org_repo allows '/'
# (GitLab subgroups, e.g. group/subgroup/project, are a real, supported
# target shape -- see _gl_url_match's own (.+) capture above), so this
# is a safe-URL-path-segment charset, not a slash-count restriction: it
# blocks the characters (spaces, ?, &, #, quotes) that could actually
# alter a glab/gh api URL's path or query, not innocuous punctuation.
#
# review_hostname gets the same treatment -- both _gl_url_match's and
# _gl_bare_host_match's hostname captures are permissive charsets
# ([^/]+ / [^/:]+), same as org_repo/number were before this assert
# existed. Not a shell-injection vector (every downstream consumer --
# fetch_pr_context.py, post_review_comment.py's --host, ansible.builtin.git's repo: --
# is invoked via argv:/module params, never a shell string), but a
# garbage hostname should fail loudly here with a clear message rather
# than silently produce a malformed URL several tasks downstream. Both
# charsets below also reject a leading '-' specifically -- argv: still
# passes these as literal strings, not shell tokens, but a leading '-'
# would be parsed as a CLI flag by glab/gh's own argument parser rather
# than treated as the literal org/repo or hostname value.
- name: Reject a review target whose org/repo, number, or hostname isn't safe to embed in a platform API URL
  ansible.builtin.assert:
    that:
      # Anchored to require a non-'-' first character, not just an
      # allowed charset: fetch_pr_context.py/post_review_comment.py
      # both pass these values as later argv: elements to the glab/gh
      # CLI, where a leading '-' would be parsed as a flag rather than
      # the literal string, regardless of the rest of the charset being
      # otherwise safe.
      - review_org_repo is regex('^[A-Za-z0-9_~][A-Za-z0-9._~/-]*$')
      - review_number is regex('^[0-9]+$')
      - review_hostname == '' or review_hostname is regex('^[A-Za-z0-9_][A-Za-z0-9._-]*$')
    fail_msg: >-
      review_target '{{ review_target }}' resolved to an org/repo, number, or
      hostname containing characters unsafe to embed directly in a platform
      API URL (org/repo: '{{ review_org_repo }}', number: '{{ review_number }}',
      hostname: '{{ review_hostname }}').
