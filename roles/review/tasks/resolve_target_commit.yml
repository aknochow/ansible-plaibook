---
# Bare commit review (no PR/MR). Validates via git; builds free local context.
# Same output contract as PR/branch modes.
# Reads commit_sha/repo_path as ambient play vars (defaults: HEAD, $PWD).
# commit_sha may be one ref, or a two-dot range BASE..TIP.

- name: Resolve the commit ref or two-dot range
  ansible.builtin.include_tasks: resolve_commit_refs.yml

# The debug line is not the result. Quiet `plai review` discards
# playbook stdout once last_run.<id>.json exists, and an empty
# pipeline_findings_reports makes format_pretty print `status: ok`.
# Persist the same sentence on the target so the CLI can show it.
- name: Record an empty commit range as the review result
  when: review_range_empty | default(false) | bool
  vars:
    _empty_range_reason: "Commit range {{ commit_sha }} is empty; nothing to review."
    _empty_range_tip_short: "{{ _range_short_shas.results[1].stdout | trim }}"
  ansible.builtin.set_fact:
    review_verdict: NOTHING_TO_REVIEW
    review_short_sha: "{{ _empty_range_tip_short }}"
    review_org_repo: "{{ repo_path | basename }}"
    review_number: "{{ _empty_range_tip_short }}"
    review_skip_reason: "{{ _empty_range_reason }}"
    pipeline_findings_reports: >-
      {{ (pipeline_findings_reports | default([])) + [{
        'target': commit_sha | string,
        'report': _empty_range_reason,
        'verdict': 'NOTHING_TO_REVIEW',
        'summary_path': '',
        'findings_path': '',
        'summary_run_scoped_path': '',
        'findings_run_scoped_path': '',
        'range_empty': true,
        'skip_reason': _empty_range_reason
      }] }}

- name: Report an empty commit range
  when: review_range_empty | default(false) | bool
  ansible.builtin.debug:
    msg: "{{ review_skip_reason }}"

- name: Build commit context and run the review
  when: not (review_range_empty | default(false) | bool)
  block:
    - name: Resolve the current branch name
      ansible.builtin.command:
        argv: [git, rev-parse, --abbrev-ref, HEAD]
        chdir: "{{ repo_path }}"
      changed_when: false
      register: _resolved_branch
      timeout: 30

    - name: Record the branch name
      ansible.builtin.set_fact:
        review_branch: "{{ _resolved_branch.stdout | trim }}"

    # One command per register. A skipped task still writes its
    # register, so a when/when-not pair on the same variable leaves
    # the skipped result (no stdout) for the template.
    - name: Choose the commit-message and diff-stat commands
      ansible.builtin.set_fact:
        _commit_log_argv: >-
          {{
            ['git', 'log', '--reverse', '--format=%B', review_target_ref ~ '..' ~ review_source_ref]
            if (review_commit_range | bool)
            else ['git', 'log', '-1', '--format=%B', review_source_ref]
          }}
        _commit_stat_argv: >-
          {{
            ['git', 'diff', '--stat', '--no-ext-diff', '--no-textconv', review_target_ref, review_source_ref, '--']
            if (review_commit_range | bool)
            else ['git', 'show', '--stat', '--format=', '--no-ext-diff', '--no-textconv', review_source_ref]
          }}

    - name: Get the commit message
      ansible.builtin.command:
        argv: "{{ _commit_log_argv }}"
        chdir: "{{ repo_path }}"
      changed_when: false
      register: _commit_message
      timeout: 30

    - name: Get the file stat summary
      ansible.builtin.command:
        argv: "{{ _commit_stat_argv }}"
        chdir: "{{ repo_path }}"
      changed_when: false
      register: _commit_stat
      timeout: 30

    - name: Build the review context
      ansible.builtin.set_fact:
        review_context: "{{ lookup('template', role_path + '/templates/commit_context.j2') }}"

    - name: Run the review engine
      when: not (review_skip_engine | default(false) | bool)
      ansible.builtin.include_tasks: run_review_engine.yml
