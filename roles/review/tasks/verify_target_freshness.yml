---
# Verify cloned PR/MR HEAD matches platform's current HEAD (async ref mirrors can lag).
# Polls REST API via fetch_pr_context.py to catch sync gaps without external CLI tools.

- name: Poll the platform REST API for the PR/MR's current HEAD sha
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/files/pr_review/fetch_pr_context.py"
      - "{{ review_summary_url }}"
  register: review_head_check
  changed_when: false
  failed_when: false
  until: >-
    review_head_check.rc == 0
    and ((review_head_check.stdout | from_json).head_sha | default('')) == review_clone_result.after
  retries: "{{ review_freshness_check_retries }}"
  delay: "{{ review_freshness_check_delay }}"

- name: Fail loudly if the platform API could not be reached to verify freshness
  ansible.builtin.fail:
    msg: >-
      Could not verify {{ review_org_repo }} #{{ review_number }}'s current HEAD via
      the {{ review_platform }} REST API after {{ review_head_check.attempts | default(1) }}
      attempt(s): {{ review_head_check.stderr | default('no output', true) }}.
      Refusing to review a commit that could not be confirmed fresh -- re-run
      once the API is reachable.
  when: review_head_check.rc != 0

- name: Extract the platform-reported current HEAD sha
  ansible.builtin.set_fact:
    review_api_head_sha: "{{ (review_head_check.stdout | from_json).head_sha | default('') }}"

- name: Fail loudly if the target has moved since cloning
  ansible.builtin.fail:
    msg: >-
      {{ review_org_repo }} {{ 'MR' if review_platform == 'gitlab' else 'PR' }}
      #{{ review_number }}: cloned SHA {{ review_clone_result.after }} does not
      match the {{ review_platform }} API's reported HEAD {{ review_api_head_sha }}
      after {{ review_head_check.attempts | default(1) }} attempt(s).
      Re-run the review to pick up the latest commit.
  when: review_api_head_sha != review_clone_result.after
