version: 2

# No Ansible Galaxy / collections-requirements.yml ecosystem exists here.
# SHA-pinned git collections are bumped by
# .github/workflows/bump-collection-pins.yml instead.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      uv-lock:
        patterns:
          - "*"
