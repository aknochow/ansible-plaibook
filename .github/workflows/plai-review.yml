name: plai

# pull_request_target reads this file from the base branch. A pull
# request cannot replace the workflow that receives CURSOR_API_KEY or
# the GitHub App private key. pull_request is not a trigger: that event
# runs the workflow file from the pull request and still injects those
# secrets for a same-repository head. pull_request_target reviews only
# a head in this repository. A fork is reviewed from a /plai-review
# comment when the pull request author is OWNER, MEMBER, or
# COLLABORATOR. The job token is read-only.
# workflow_dispatch runs only when the selected ref is the default
# branch. issue_comment already runs from the default branch.
# Re-run with a pull-request comment that starts with /plai-review.
# A newer push or comment for the same pull request cancels the
# in-flight run.
# This file calls the reusable workflow at an immutable commit, not a
# same-repository path. The called workflow checks out a fixed commit of
# this repository, never the pull request head. This caller does not
# pass a ref. The caller grants contents:read, pull-requests:read, and
# checks:read. The called job keeps that read-only token. Posting uses
# the GitHub App installation token. PLAI_GITHUB_APP_ID and
# PLAI_GITHUB_APP_PRIVATE_KEY post the review as the GitHub App whose
# slug is plai-review.
# CURSOR_API_KEY, PLAI_GITHUB_APP_ID, and PLAI_GITHUB_APP_PRIVATE_KEY
# are environment secrets on plaibook-review. GitHub rejects environment
# on this caller job because it uses a reusable workflow. The called
# review job sets the environment. Deployment branches are main only.
# pull_request_target evaluates that rule against the default branch.
# A pull_request workflow evaluates it against refs/pull/N/merge.
# This caller does not forward secrets. The called job reads the
# environment names itself. These names must not also exist as
# repository secrets.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions: {}

concurrency:
  group: plaibook-review-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    name: plai
    if: >-
      (
        github.event_name == 'workflow_dispatch'
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      )
      || (
        github.event_name == 'pull_request_target'
        && github.event.pull_request.head.repo.full_name == github.repository
      )
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && !endsWith(github.event.comment.user.login, '[bot]')
        && startsWith(github.event.comment.body, '/plai-review')
        && (
          github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: aknochow/ansible-plaibook/.github/workflows/plai-review-run.yml@4490fc66b59af3c81b9d689cdd7c639a3f739d71
    # Only these three environment names. The rest of the repository
    # and organization secrets stay on the caller. The called job's
    # plaibook-review environment supplies the values.
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      PLAI_GITHUB_APP_ID: ${{ secrets.PLAI_GITHUB_APP_ID }}
      PLAI_GITHUB_APP_PRIVATE_KEY: ${{ secrets.PLAI_GITHUB_APP_PRIVATE_KEY }}
