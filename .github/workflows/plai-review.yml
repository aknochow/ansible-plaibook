name: plai

# pull_request_target reads this file from the base branch. A pull
# request cannot replace the workflow that receives CURSOR_API_KEY or
# the GitHub App private key. pull_request is not a trigger: that event
# runs the workflow file from the pull request and still injects those
# secrets for a same-repository head. The job token is read-only.
# workflow_dispatch runs only when the selected ref is the default
# branch. issue_comment already runs from the default branch.
# Re-run with a pull-request comment that starts with /plai-review.
# A newer push or comment for the same pull request cancels the
# in-flight run.
# This file calls the reusable workflow at an immutable commit, not a
# same-repository path. The called workflow checks out a fixed commit of
# this repository, never the pull request head. This caller does not
# pass a ref. The caller grants contents:read, pull-requests:read, and
# checks:read. The called job keeps that read-only token. Posting uses
# the GitHub App installation token. PLAI_GITHUB_APP_ID and
# PLAI_GITHUB_APP_PRIVATE_KEY post the review as the GitHub App whose
# slug is plai-review. That app needs Contents: write so a request for
# changes is a write review, and Administration: write so it can dismiss
# its own stale request on a protected branch. The job token stays
# read-only.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions: {}

concurrency:
  group: plaibook-review-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    name: plai
    if: >-
      (
        github.event_name == 'workflow_dispatch'
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      )
      || (
        github.event_name == 'pull_request_target'
        && github.event.pull_request.head.repo.full_name == github.repository
      )
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && !endsWith(github.event.comment.user.login, '[bot]')
        && startsWith(github.event.comment.body, '/plai-review')
        && (
          github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: aknochow/ansible-plaibook/.github/workflows/plai-review-run.yml@95b8332ba5b4d9c06c37e759fcb93fadf9dd83fa
    secrets:
      cursor_api_key: ${{ secrets.CURSOR_API_KEY }}
      github_app_id: ${{ secrets.PLAI_GITHUB_APP_ID }}
      github_app_private_key: ${{ secrets.PLAI_GITHUB_APP_PRIVATE_KEY }}
