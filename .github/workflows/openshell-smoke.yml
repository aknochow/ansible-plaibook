name: OpenShell smoke

# Starts the pinned gateway and one sandbox when a pin moves. The review check
# runs from its own pinned workflow, so it would not catch a bad pin here. This
# job holds no secrets and makes no model calls.

on:
  pull_request:
    paths:
      - .github/openshell-pins.env
      - .github/workflows/openshell-smoke.yml
      - scripts/ci_openshell_up.sh

permissions:
  contents: read

jobs:
  smoke:
    name: Start the gateway and a sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          persist-credentials: false

      - name: Load the OpenShell pins
        run: grep -E '^[A-Z0-9_]+=' .github/openshell-pins.env >> "$GITHUB_ENV"

      - name: Start OpenShell and a sandbox
        env:
          OPENSHELL_SMOKE: "true"
        run: bash scripts/ci_openshell_up.sh
