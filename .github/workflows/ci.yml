name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Ubuntu names stay "Test (Python 3.x)" so they match the required
    # status checks on main. Jobs on any other runner include the OS.
    name: "${{ matrix.os == 'ubuntu-latest' && format('Test (Python {0})', matrix.python-version) || format('Test (Python {0}, {1})', matrix.python-version, matrix.os) }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Homebrew-class Mac install is Python 3.10 + old setuptools.
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies with lockfile
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Run ruff lint check
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Cache Ansible collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/plaibook-collections
          key: collections-${{ runner.os }}-${{ hashFiles('collections-requirements.yml', 'scripts/ci-install-collections.py', 'plaibook/collections.py') }}

      - name: Install required collections
        env:
          GIT_TERMINAL_PROMPT: "0"
          GITHUB_TOKEN: ${{ github.token }}
          PLAIBOOK_COLLECTIONS_DEST: ${{ runner.temp }}/plaibook-collections
        run: |
          dest="${PLAIBOOK_COLLECTIONS_DEST}"
          mkdir -p "$dest"
          echo "ANSIBLE_COLLECTIONS_PATH=${dest}" >> "$GITHUB_ENV"
          uv run --python "${{ matrix.python-version }}" python scripts/ci-install-collections.py

      - name: Run ansible-lint check
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/plaibook-collections
        run: uv run --python ${{ matrix.python-version }} ansible-lint --offline

      - name: Check playbook syntax
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/plaibook-collections
        run: uv run --python ${{ matrix.python-version }} ansible-playbook review.yml --syntax-check

      - name: Run pytest test suite
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/plaibook-collections
        run: uv run --python ${{ matrix.python-version }} pytest -v --tb=short

      - name: Run offline Ansible playbook tests
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/plaibook-collections
        run: uv run --python ${{ matrix.python-version }} ./scripts/run_playbook_tests.sh

  # Same lockfile audit collections inherit via collection-ci.yml. OSV over
  # uv.lock so the job fails on known-vulnerable pins CI would actually install.
  # Inline action (not nested reusable): `upload-sarif: false` on the Google
  # reusable caused a workflow startup_failure. Docker scanner exits non-zero
  # on vulns; no SARIF / security-events write.
  lockfile-audit:
    name: Lockfile audit (OSV)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Scan locked uv.lock with OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=uv.lock

  # Homebrew Python 3.10 pip often drives setuptools 68 in-process
  # (--no-build-isolation). SPDX license = "Apache-2.0" fails that
  # backend before requires-python is even checked.
  pip-legacy-setuptools:
    name: pip install (setuptools 68, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: pip install . with setuptools 68 and no build isolation
        run: |
          uv venv --python 3.10 .venv-legacy
          uv pip install --python .venv-legacy/bin/python --require-hashes \
            -r scripts/legacy-setuptools-requirements.txt
          # This job proves the setuptools 68 backend can build plaibook.
          # Do not resolve pyproject dependencies here (unhashed). Runtime
          # deps are locked in uv.lock and audited by lockfile-audit.
          .venv-legacy/bin/python -m pip install . --no-build-isolation --no-deps
          test -x .venv-legacy/bin/plai
          .venv-legacy/bin/python -c "from importlib.metadata import version; print(version('plaibook'))"
