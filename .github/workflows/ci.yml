name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies with lockfile
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Install ansible.posix collection
        run: uv run --python ${{ matrix.python-version }} ansible-galaxy collection install ansible.posix

      - name: Check playbook syntax
        run: uv run --python ${{ matrix.python-version }} ansible-playbook review.yml --syntax-check

      - name: Run pytest test suite
        run: uv run --python ${{ matrix.python-version }} pytest -v --tb=short

      - name: Run offline Ansible playbook tests
        run: uv run --python ${{ matrix.python-version }} ./scripts/run_playbook_tests.sh
