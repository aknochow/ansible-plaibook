name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies with lockfile
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Install required collections
        run: uv run --python ${{ matrix.python-version }} ansible-galaxy collection install -r collections-requirements.yml

      - name: Run ruff lint check
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Run ansible-lint check
        run: uv run --python ${{ matrix.python-version }} ansible-lint --offline

      - name: Check playbook syntax
        run: uv run --python ${{ matrix.python-version }} ansible-playbook review.yml --syntax-check

      - name: Run pytest test suite
        run: uv run --python ${{ matrix.python-version }} pytest -v --tb=short

      - name: Run offline Ansible playbook tests
        run: uv run --python ${{ matrix.python-version }} ./scripts/run_playbook_tests.sh

  # Same lockfile audit collections inherit via collection-ci.yml. OSV over
  # uv.lock so the job fails on known-vulnerable pins CI would actually install.
  # SARIF upload stays off (see collection-ci.yml).
  lockfile-audit:
    name: Lockfile audit (OSV)
    permissions:
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      fail-on-vuln: true
      upload-sarif: false
      scan-args: |-
        --lockfile=uv.lock
