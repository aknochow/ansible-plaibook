name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies with lockfile
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Install required collections
        run: uv run --python ${{ matrix.python-version }} ansible-galaxy collection install -r collections-requirements.yml

      - name: Run ruff lint check
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Check playbook syntax
        run: uv run --python ${{ matrix.python-version }} ansible-playbook review.yml --syntax-check

      - name: Run pytest test suite
        run: uv run --python ${{ matrix.python-version }} pytest -v --tb=short

      - name: Run offline Ansible playbook tests
        run: uv run --python ${{ matrix.python-version }} ./scripts/run_playbook_tests.sh
