name: Cut a GitHub release

# Runs when a push to main changes pyproject.toml, which is what merging a
# chore/release-<version> pull request does. Also runs on workflow_dispatch.
# Reads the version at the pushed commit. On push, a version that already
# has a tag is a no-op (a pyproject.toml edit that is not a release). On
# dispatch, an existing tag fails.
#
# Before tagging, the job builds the sdist and the wheel from it and runs
# scripts/check_dist.py, the same check publish.yml runs. A package that
# cannot build never gets a tag or a Release.
#
# Authentication is a GitHub App installation token from the release
# environment (RELEASE_GITHUB_APP_ID and RELEASE_GITHUB_APP_PRIVATE_KEY).
# GITHUB_TOKEN is not used. A release created with GITHUB_TOKEN does not
# trigger publish.yml or ee-publish.yml. The Release this job creates
# starts both, and publish.yml uploads to PyPI without an approval step.
# This workflow does not pin the review Action.

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  cut:
    name: Tag and publish the release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Does this version need a release
        id: need
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/release_version.py --print-current)"
          tag="v${version}"
          if [ -n "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
            if [ "$EVENT_NAME" = "push" ]; then
              echo "${tag} already exists; this push is not a release"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "tag ${tag} already exists" >&2
            exit 1
          fi
          echo "releasing ${tag}"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Require the release GitHub App credentials
        if: steps.need.outputs.release == 'true'
        env:
          RELEASE_GITHUB_APP_ID: ${{ secrets.RELEASE_GITHUB_APP_ID }}
          RELEASE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.RELEASE_GITHUB_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_GITHUB_APP_ID}" ] || [ -z "${RELEASE_GITHUB_APP_PRIVATE_KEY}" ]; then
            echo "RELEASE_GITHUB_APP_ID and RELEASE_GITHUB_APP_PRIVATE_KEY are unset. Set them on the release environment. A release created with GITHUB_TOKEN does not trigger publish.yml or ee-publish.yml." >&2
            exit 1
          fi

      - name: Install uv
        if: steps.need.outputs.release == 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Set up Python
        if: steps.need.outputs.release == 'true'
        run: uv python install 3.12

      - name: Build the sdist and the wheel from it
        if: steps.need.outputs.release == 'true'
        run: uv build

      - name: Wheel must vendor the playbook and review skill
        if: steps.need.outputs.release == 'true'
        run: python3 scripts/check_dist.py dist

      - name: Create the tag and GitHub Release
        if: steps.need.outputs.release == 'true'
        env:
          RELEASE_GITHUB_APP_ID: ${{ secrets.RELEASE_GITHUB_APP_ID }}
          RELEASE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.RELEASE_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: python3 scripts/release_cut.py --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA"
