name: Publish to PyPI

# First release: create a pending trusted publisher on PyPI, add a GitHub
# environment named `pypi` with required reviewers and a v* tag rule, merge
# this workflow, then publish a GitHub Release. Do not store a PyPI API token.
# The workflow filename (`publish.yml`) is load-bearing — it must match the
# pending publisher exactly.
#
# Human gate: GitHub Environment `pypi` (reviewers + tag rules). YAML cannot
# require those. Workflow-side controls: no workflow_dispatch, skip
# prereleases, tag must equal v${project.version}, and the tagged commit
# must already be on the repository default branch.

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build sdist and wheel
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          fetch-depth: 0

      - name: Release commit must be on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          head=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$head" "origin/${DEFAULT_BRANCH}"; then
            echo "Release commit ${head} is not on origin/${DEFAULT_BRANCH}"
            exit 1
          fi
          echo "release commit ${head} is an ancestor of origin/${DEFAULT_BRANCH}"

      - name: Release tag must match pyproject version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          print("python", sys.version.replace("\n", " "))
          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'(?m)^version\s*=\s*"([^"]+)"', text)
          if not match:
              raise SystemExit("pyproject.toml has no version = \"...\" line")
          version = match.group(1)
          tag = os.environ.get("RELEASE_TAG", "")
          expected = "v" + version
          if tag != expected:
              raise SystemExit(f"release tag {tag!r} must be {expected!r}")
          print("tag ok", tag)
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Build
        run: uv build

      - name: Wheel must vendor review.yml
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheels = list(Path("dist").glob("plaibook-*.whl"))
          sdists = list(Path("dist").glob("plaibook-*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"expected one wheel and one sdist in dist/: {list(Path('dist').iterdir())}")
          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
          if "plaibook/share/review.yml" not in names:
              raise SystemExit("wheel is missing plaibook/share/review.yml")
          if "plaibook/share/ansible.cfg" not in names:
              raise SystemExit("wheel is missing plaibook/share/ansible.cfg")
          if "plaibook/share/collections-requirements.yml" not in names:
              raise SystemExit("wheel is missing plaibook/share/collections-requirements.yml")
          with tarfile.open(sdists[0], "r:gz") as tf:
              members = tf.getnames()
          if not any(name.endswith("/review.yml") for name in members):
              raise SystemExit("sdist is missing review.yml")
          print("vendored playbook ok:", wheels[0].name)
          PY

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/plaibook
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
