name: Publish to PyPI

# First release: create a pending trusted publisher on PyPI, add a GitHub
# environment named `pypi` with required reviewers and a v* tag rule, merge
# this workflow, then publish a GitHub Release. Do not store a PyPI API token.
# The workflow filename (`publish.yml`) is load-bearing — it must match the
# pending publisher exactly.
#
# No human approval step: release-cut.yml creates the Release from main
# after the release pull request merges, and that is the decision to ship.
# The `pypi` environment keeps its v* tag rule. Workflow-side controls: no
# workflow_dispatch, skip prereleases, tag must equal v${project.version},
# the tagged commit must already be on the repository default branch, and
# the dist check passes. release-cut.yml runs the same build and check
# before it tags, so a package that cannot build never gets a tag.

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build sdist and wheel
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          fetch-depth: 0

      - name: Release commit must be on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          head=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$head" "origin/${DEFAULT_BRANCH}"; then
            echo "Release commit ${head} is not on origin/${DEFAULT_BRANCH}"
            exit 1
          fi
          echo "release commit ${head} is an ancestor of origin/${DEFAULT_BRANCH}"

      - name: Release tag must match pyproject version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          print("python", sys.version.replace("\n", " "))
          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'(?m)^version\s*=\s*"([^"]+)"', text)
          if not match:
              raise SystemExit("pyproject.toml has no version = \"...\" line")
          version = match.group(1)
          tag = os.environ.get("RELEASE_TAG", "")
          expected = "v" + version
          if tag != expected:
              raise SystemExit(f"release tag {tag!r} must be {expected!r}")
          print("tag ok", tag)
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Set up Python
        run: uv python install 3.12

      - name: Build
        run: uv build

      - name: Wheel must vendor the playbook and review skill
        run: python3 scripts/check_dist.py dist

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/plaibook
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
