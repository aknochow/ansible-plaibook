name: Bump collection git pins

# Dependabot cannot update collections-requirements.yml (no Ansible ecosystem).
# This job is the stand-in for aknochow SHA-pinned type: git collections
# (openai / cursor / xai / openshell / claude / gemini). ansible-collections
# release SHAs are left alone.
#
# A pin moves only when it is an ancestor of that repo's default-branch
# HEAD (GitHub compare status ahead). Diverged and behind pins stay, and
# are listed in the PR body when a fast-forward also opens a PR. If no
# pin moves, this job opens no pull request.
#
# GitHub Actions cannot subscribe to another repository's events. Sibling
# default-branch pushes reach this workflow via repository_dispatch
# (see notify-plaibook-pin-bump.yml). A GitHub webhook URL cannot POST
# the dispatch payload; that adapter is either the sibling workflow or
# EDA (eda/collection-pin-bump.yml).
#
# The push and the pull request use a plai-crew installation token from
# the plaibook-crew environment, not GITHUB_TOKEN. GITHUB_TOKEN cannot
# open the pull request under this repo's Actions settings, and a pull
# request it did open would not run CI. The branch below is bot-owned —
# do not commit onto it.

on:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [collection-pin-bump]

permissions:
  contents: read

concurrency:
  group: bump-collection-git-pins
  cancel-in-progress: true

jobs:
  bump:
    name: Bump SHA-pinned git collections
    runs-on: ubuntu-latest
    environment: plaibook-crew
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          persist-credentials: false

      - name: Mint a plai-crew installation token
        id: crew
        env:
          PLAI_CREW_APP_ID: ${{ vars.PLAI_CREW_APP_ID }}
          PLAI_CREW_PRIVATE_KEY: ${{ secrets.PLAI_CREW_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          token="$(python3 scripts/github_app_token.py \
            --repo "$GITHUB_REPOSITORY" \
            --id-env PLAI_CREW_APP_ID \
            --key-env PLAI_CREW_PRIVATE_KEY \
            --permission contents=write \
            --permission pull_requests=write)"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - name: Refresh SHA pins
        env:
          GITHUB_TOKEN: ${{ steps.crew.outputs.token }}
        run: python3 scripts/bump_collection_pins.py --write --pr-body /tmp/collection-pin-pr.md

      - name: Record dispatch source
        if: github.event_name == 'repository_dispatch'
        run: |
          {
            echo ""
            echo "Triggered by \`${{ github.event.client_payload.repository || 'unknown' }}\` \`${{ github.event.client_payload.sha || 'unknown' }}\`."
          } >> /tmp/collection-pin-pr.md

      - name: Open or update the pin bump PR
        env:
          GH_TOKEN: ${{ steps.crew.outputs.token }}
        run: |
          if git diff --quiet -- collections-requirements.yml; then
            echo "No SHA pin moved."
            if [ -f /tmp/collection-pin-pr.md ]; then
              cat /tmp/collection-pin-pr.md
            fi
            exit 0
          fi
          git config user.name "plai-crew[bot]"
          git config user.email "5277323+plai-crew[bot]@users.noreply.github.com"
          git checkout -B chore/bump-collection-git-pins
          git add collections-requirements.yml
          git commit -s -m "chore(deps): bump SHA-pinned git collections"
          gh auth setup-git
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git push --force-with-lease origin chore/bump-collection-git-pins
          # REST: gh pr list uses GraphQL.
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=${GITHUB_REPOSITORY_OWNER}:chore/bump-collection-git-pins&state=open" --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            echo "Updated existing PR #${existing}"
            exit 0
          fi
          gh pr create \
            --title "chore(deps): bump SHA-pinned git collections" \
            --body-file /tmp/collection-pin-pr.md
